openapi: 3.2.1
info:
  title: TeachBuddy materials
  version: 1.0.0-candidate.1
  description: R30/v1 待独立审查。唯一材料 HTTP/schema。B11 保持冻结；v2 question/lesson 与旧对象同 ID、同事务，不复制业务库。语义、版本过渡、错误优先级见 materials.md。
x-contract-status: READY_FOR_REVIEW
x-source-revision: e6d2c220796ea0746bec3413db7ba259df4c2d45
servers:
- url: /
security:
- SessionCookie: []
paths:
  /api/workbench/files/{id}/recognition:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: getFileRecognition
      description: 只读固定预览的识别状态，不触发模型；语义见 recognition.md。
      parameters:
      - name: renditionFileId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 当前账户原件、固定 rendition 和每页状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionSummary'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: requestFileRecognition
      description: 冻结来源及页号，复用活跃请求和成功页；重试、取消沿用 Job。仅返回持久受理结果。
      parameters:
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognitionInput'
      responses:
        '202':
          description: 已受理的识别 Job，尚未表示识别成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/workbench/files/{id}/recognition/pages/{page}:
    get:
      operationId: getRecognizedPage
      description: 返回绑定本次原件与页码的机器结果；同像素复用不会串用另一份原件的 Location。
      parameters:
