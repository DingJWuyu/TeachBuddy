          $ref: '#/components/responses/503'
components:
  schemas:
    RecognitionInput:
      type: object
      properties:
        renditionFileId:
          $ref: '#/components/schemas/Id'
        pages:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      required: [renditionFileId, pages]
      additionalProperties: false
    RecognitionSummary:
      type: object
      properties:
        available:
          type: boolean
        revision:
          type: string
        fileId:
          $ref: '#/components/schemas/Id'
        renditionFileId:
          $ref: '#/components/schemas/Id'
        jobId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        pages:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
              state:
                enum: [unprocessed, queued, running, cancelling, ready, failed, interrupted]
              resultId:
                anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              issues:
                type: array
                items:
                  type: object
            required: [page, state, resultId, issues]
      required: [available, revision, fileId, renditionFileId, jobId, pages]
    RecognizedPage:
      type: object
      properties:
        state:
          enum: [unprocessed, running, ready, failed, interrupted]
        resultId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        location:
          $ref: '#/components/schemas/Location'
        imageFileId:
          $ref: '#/components/schemas/Id'
        width:
          type: integer
        height:
          type: integer
        document:
          $ref: '#/components/schemas/Document'
        text:
          type: string
        blocks:
          type: array
          items:
            type: object
        rawFileId:
          $ref: '#/components/schemas/Id'
        assetFileIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        issues:
          type: array
          items:
            type: object
      required: [state, resultId, location, imageFileId, width, height, issues]
    Id:
      $ref: ./first-flow.openapi.yaml#/components/schemas/Id
    Version:
      $ref: ./first-flow.openapi.yaml#/components/schemas/Version
    Timestamp:
      $ref: ./first-flow.openapi.yaml#/components/schemas/Timestamp
    TextRun:
      $ref: ./first-flow.openapi.yaml#/components/schemas/TextRun
    MathRun:
      $ref: ./first-flow.openapi.yaml#/components/schemas/MathRun
    Paragraph:
      $ref: ./first-flow.openapi.yaml#/components/schemas/Paragraph
    MathBlock:
      $ref: ./first-flow.openapi.yaml#/components/schemas/MathBlock
    SetDeletion:
      $ref: ./first-flow.openapi.yaml#/components/schemas/SetDeletion
    PurgeResource:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
    ResourcePurged:
      type: object
      additionalProperties: false
      required: [id, permanentlyDeleted]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        permanentlyDeleted:
          const: true
    LessonHistory:
      type: object
      required: [items, limit]
      properties:
        limit:
          const: 50
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [version, savedAt, title]
            properties:
              version:
                $ref: '#/components/schemas/Version'
              savedAt:
                $ref: '#/components/schemas/Timestamp'
              title:
                type: string
    CopyLessonSections:
      type: object
      additionalProperties: false
      required: [baseVersion, sourceLessonId, sourceVersion, sectionIds]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
        sourceLessonId:
          $ref: '#/components/schemas/Id'
        sourceVersion:
          $ref: '#/components/schemas/Version'
        sectionIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    RestoreLessonVersion:
      type: object
      additionalProperties: false
      required: [baseVersion, version]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
        version:
          $ref: '#/components/schemas/Version'
    CopyLesson:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
    PurgeLesson:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
    LessonPurged:
      type: object
      additionalProperties: false
      required: [id, permanentlyDeleted]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        permanentlyDeleted:
          const: true
    PurgeQuestionContent:
      type: object
      additionalProperties: false
      required: [baseVersion]
      properties:
        baseVersion:
          $ref: '#/components/schemas/Version'
    QuestionContentPurged:
      type: object
      additionalProperties: false
      required: [id, permanentlyDeleted]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        permanentlyDeleted:
          const: true
    Box:
      type: object
      properties:
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        height:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      required:
      - x
      - y
      - width
      - height
      additionalProperties: false
    PageLocation:
      type: object
      properties:
        kind:
          const: page
        fileId:
          $ref: '#/components/schemas/Id'
        renditionFileId:
          $ref: '#/components/schemas/Id'
        page:
          type: integer
          minimum: 1
        box:
          anyOf:
          - $ref: '#/components/schemas/Box'
          - type: 'null'
      required:
      - kind
      - fileId
      - renditionFileId
      - page
      - box
      additionalProperties: false
    TextLocation:
      type: object
      properties:
        kind:
          const: text
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
      required:
      - kind
      - start
      - end
      additionalProperties: false
    DocxLocation:
      type: object
      properties:
        kind:
          const: docx
        fileId:
          $ref: '#/components/schemas/Id'
        part:
          const: word/document.xml
        paragraph:
          type: integer
          minimum: 1
        runStart:
          type: integer
          minimum: 0
        runEnd:
          type: integer
          minimum: 1
      required:
      - kind
      - fileId
      - part
      - paragraph
      - runStart
      - runEnd
      additionalProperties: false
    Location:
      oneOf:
      - $ref: '#/components/schemas/PageLocation'
      - $ref: '#/components/schemas/TextLocation'
      - $ref: '#/components/schemas/DocxLocation'
    LocatedPart:
      type: object
      properties:
        role:
          enum:
          - body
          - solution
          - figure
          - unassigned
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
          minItems: 1
          maxItems: 100
      required:
      - role
      - locations
      additionalProperties: false
    ImageBlock:
      type: object
      properties:
        type:
          const: image
        fileId:
          $ref: '#/components/schemas/Id'
        alt:
          type: string
          minLength: 0
          maxLength: 2000
        widthMm:
          type: number
          minimum: 5
          maximum: 170
      required:
      - type
      - fileId
      - alt
      - widthMm
      additionalProperties: false
    HeadingBlock:
      type: object
      properties:
        type:
          const: heading
        level:
          enum:
          - 1
          - 2
          - 3
        runs:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TextRun'
            - $ref: '#/components/schemas/MathRun'
          minItems: 1
          maxItems: 200
      required:
      - type
      - level
      - runs
      additionalProperties: false
    ListBlock:
      type: object
      properties:
        type:
          const: list
        role:
          enum:
          - options
          - subquestions
          - plain
        items:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 0
                maxLength: 30
              blocks:
                type: array
                items:
                  $ref: '#/components/schemas/LeafBlock'
                minItems: 1
                maxItems: 100
            required:
            - label
            - blocks
            additionalProperties: false
          minItems: 1
          maxItems: 100
      required:
      - type
      - role
      - items
      additionalProperties: false
    TableBlock:
      type: object
      properties:
        type:
          const: table
        rows:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                blocks:
                  type: array
                  items:
                    $ref: '#/components/schemas/LeafBlock'
                  minItems: 0
                  maxItems: 100
              required:
              - blocks
              additionalProperties: false
            minItems: 1
            maxItems: 20
          minItems: 1
          maxItems: 100
      required:
      - type
      - rows
      additionalProperties: false
    TeacherNoteBlock:
      type: object
      properties:
        type:
          const: teacher-note
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/LeafBlock'
          minItems: 1
          maxItems: 100
      required:
      - type
      - blocks
      additionalProperties: false
    LeafBlock:
      oneOf:
      - $ref: '#/components/schemas/Paragraph'
      - $ref: '#/components/schemas/MathBlock'
      - $ref: '#/components/schemas/ImageBlock'
    Block:
      oneOf:
      - $ref: '#/components/schemas/Paragraph'
      - $ref: '#/components/schemas/MathBlock'
      - $ref: '#/components/schemas/ImageBlock'
      - $ref: '#/components/schemas/HeadingBlock'
      - $ref: '#/components/schemas/ListBlock'
      - $ref: '#/components/schemas/TableBlock'
      - $ref: '#/components/schemas/TeacherNoteBlock'
    DocumentV2:
      type: object
      properties:
        version:
          const: 2
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          minItems: 0
          maxItems: 1000
      required:
      - version
      - blocks
      additionalProperties: false
    Document:
      oneOf:
      - $ref: ./first-flow.openapi.yaml#/components/schemas/Document
      - $ref: '#/components/schemas/DocumentV2'
      description: v1 原样保留；v2 增加受限结构，不接受 HTML、任意 attrs 或可执行内容。语义与限额见 materials.md#内容。
    File:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        name:
          type: string
          minLength: 1
          maxLength: 200
        mediaType:
          type: string
          minLength: 1
          maxLength: 150
        byteLength:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        duplicateOfFileId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - id
      - createdAt
      - name
      - mediaType
      - byteLength
      - sha256
      - duplicateOfFileId
    Upload:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
      additionalProperties: false
    PreviewPage:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        imageFileId:
          $ref: '#/components/schemas/Id'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
      - page
      - imageFileId
      - width
      - height
      additionalProperties: false
    Preview:
      type: object
      properties:
        fileId:
          $ref: '#/components/schemas/Id'
        jobId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        state:
          enum:
          - pending
          - ready
          - limited
          - failed
        renditionFileId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        pageCount:
