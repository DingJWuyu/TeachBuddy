components:
  securitySchemes:
    SessionCookie:
      $ref: ../auth.openapi.yaml#/components/securitySchemes/SessionCookie
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Query:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
        default: ''
    State:
      name: state
      in: query
      schema:
        enum:
        - active
        - deleted
        default: active
    Starred:
      name: starred
      in: query
      schema:
        type: boolean
      description: 省略为全部；仅接受字面 true/false。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrowserRequestProtection:
      $ref: ../auth.openapi.yaml#/components/parameters/BrowserRequestProtection
    RequestOrigin:
      $ref: ../auth.openapi.yaml#/components/parameters/RequestOrigin
    RequestReferer:
      $ref: ../auth.openapi.yaml#/components/parameters/RequestReferer
  responses:
    '400':
      description: malformed-json
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem400'
          examples:
            malformed-json:
              value:
                type: /problems/workbench/malformed-json
    '401':
      description: unauthenticated
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem401'
          examples:
            unauthenticated:
              value:
                type: /problems/workbench/unauthenticated
    '403':
      description: request-not-allowed
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem403'
          examples:
            request-not-allowed:
              value:
                type: /problems/workbench/request-not-allowed
    '404':
      description: not-found
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem404'
          examples:
            not-found:
              value:
                type: /problems/workbench/not-found
    '409':
      description: version-conflict / reference-version-conflict / idempotency-key-reused / object-deleted
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem409'
          examples:
            version-conflict:
              value:
                type: /problems/workbench/version-conflict
                currentVersion: 2
            reference-version-conflict:
              value:
                type: /problems/workbench/reference-version-conflict
                questionId: 00000000-0000-4000-8000-000000000001
                currentVersion: 2
            idempotency-key-reused:
              value:
                type: /problems/workbench/idempotency-key-reused
            object-deleted:
              value:
                type: /problems/workbench/object-deleted
    '413':
      description: payload-too-large
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem413'
          examples:
            payload-too-large:
              value:
                type: /problems/workbench/payload-too-large
    '415':
      description: unsupported-media-type
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem415'
          examples:
            unsupported-media-type:
              value:
                type: /problems/workbench/unsupported-media-type
    '422':
      description: invalid-input
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem422'
          examples:
            invalid-input:
              value:
                type: /problems/workbench/invalid-input
                field: /body
                reason: empty-content
    '503':
      description: temporarily-unavailable
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem503'
          examples:
            temporarily-unavailable:
              value:
                type: /problems/workbench/temporarily-unavailable
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Timestamp:
      type: string
      format: date-time
    Title:
      type: string
      maxLength: 200
    Note:
      type: string
      maxLength: 20000
    TextRun:
      type: object
      properties:
        type:
          const: text
        text:
          type: string
          maxLength: 20000
      required:
      - type
      - text
      additionalProperties: false
    MathRun:
      type: object
      properties:
        type:
          const: math
        latex:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - type
      - latex
      additionalProperties: false
    Paragraph:
      type: object
      properties:
        type:
          const: paragraph
        runs:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TextRun'
            - $ref: '#/components/schemas/MathRun'
          maxItems: 1000
      required:
      - type
      - runs
      additionalProperties: false
    MathBlock:
      type: object
      properties:
        type:
          const: math
        latex:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - type
      - latex
      additionalProperties: false
    Document:
      type: object
      properties:
        version:
          const: 1
        blocks:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Paragraph'
            - $ref: '#/components/schemas/MathBlock'
          maxItems: 1000
      required:
      - version
      - blocks
      additionalProperties: false
      description: 保留输入顺序。段落可含行内公式，独立 math 块单独排版。空 blocks 合法；题目 body 另须至少有一个非空白文字或公式。未知版本/节点返回 422，不静默丢弃。
    Snapshot:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
        body:
          $ref: '#/components/schemas/Document'
        solution:
          $ref: '#/components/schemas/Document'
      required:
      - title
      - body
      - solution
    ManualSource:
      type: object
      properties:
        kind:
          const: manual
      required:
      - kind
      additionalProperties: false
    PasteSource:
      type: object
      properties:
        kind:
          const: paste
        text:
          type: string
          minLength: 1
          maxLength: 100000
      required:
      - kind
      - text
      additionalProperties: false
    CopySource:
      type: object
      properties:
        kind:
          const: copy
        questionId:
          $ref: '#/components/schemas/Id'
