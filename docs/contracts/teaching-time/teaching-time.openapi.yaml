  /api/modules:
    get:
      operationId: getTeachingModuleCatalog
      description: T53 组合后的目录 v2；仅此响应由本批加法扩展取代 B11 v1，原文件保持冻结。
      parameters: []
      responses:
        '200':
          description: 当前账户结果。
          headers: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCatalogV2'
        '401':
