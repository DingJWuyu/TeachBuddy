          $ref: '#/components/responses/503'
components:
  securitySchemes:
    SessionCookie:
      $ref: ../auth.openapi.yaml#/components/securitySchemes/SessionCookie
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    classId:
      name: classId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    originDate:
      name: originDate
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Date'
    kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
        - lesson
        - question
    State:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
        - active
        - deleted
        default: active
    Origin:
      name: originDate
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Date'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BrowserRequestProtection:
      $ref: ../auth.openapi.yaml#/components/parameters/BrowserRequestProtection
    RequestOrigin:
      $ref: ../auth.openapi.yaml#/components/parameters/RequestOrigin
    RequestReferer:
      $ref: ../auth.openapi.yaml#/components/parameters/RequestReferer
  responses:
    '400':
      description: malformed-json
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id023
                  - /problems/workbench/malformed-json
    '401':
      description: unauthenticated
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id024
                  - /problems/workbench/unauthenticated
    '403':
      description: request-not-allowed
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id025
                  - /problems/workbench/request-not-allowed
    '404':
      description: not-found
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id026
                  - /problems/workbench/not-found
    '409':
      description: version-conflict / idempotency-key-reused / object-deleted / reference-deleted / class-mismatch
        / immutable-series / invalid-move
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id027
                  - /problems/workbench/version-conflict
                  - /problems/workbench/idempotency-key-reused
                  - /problems/workbench/object-deleted
                  - /problems/workbench/reference-deleted
                  - /problems/workbench/class-mismatch
                  - /problems/workbench/immutable-series
                  - /problems/workbench/invalid-move
    '413':
      description: payload-too-large
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id028
                  - /problems/workbench/payload-too-large
    '415':
      description: unsupported-media-type
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id029
                  - /problems/workbench/unsupported-media-type
    '422':
      description: invalid-input / invalid-time-zone / reminder-not-future
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id030
                  - /problems/workbench/invalid-input
                  - /problems/workbench/invalid-time-zone
                  - /problems/workbench/reminder-not-future
    '503':
      description: temporarily-unavailable
      headers: *id001
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                type:
                  enum: &id031
                  - /problems/workbench/temporarily-unavailable
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
    Date:
      type: string
      format: date
      pattern: ^(19\d{2}|20\d{2}|2100)-\d{2}-\d{2}$
      description: 有效公历日期 1900-01-01 至 2100-12-31，语义仍校验月日。
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
    Zone:
      type: string
      minLength: 1
      maxLength: 100
      description: 有效 IANA 时区；初始 Asia/Shanghai。
    Time:
      type: object
      properties:
        date:
          $ref: '#/components/schemas/Date'
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        timeZone:
          $ref: '#/components/schemas/Zone'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
      required:
      - date
      - startTime
      - timeZone
      - durationMinutes
      additionalProperties: false
    Reminder:
      type: object
      properties:
        side:
          type: string
          enum:
          - before
          - after
        minutes:
          type: integer
          minimum: 0
          maximum: 10080
      required:
      - side
      - minutes
      additionalProperties: false
    Repeat:
      type: object
      properties:
        until:
          $ref: '#/components/schemas/Date'
      required:
      - until
      additionalProperties: false
    Item:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          maxLength: 4000
          minLength: 1
        priority:
          type: string
          enum:
          - low
          - normal
          - high
      required:
      - id
      - text
      - priority
      additionalProperties: false
    SourceInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - lesson
          - question
        id:
          $ref: '#/components/schemas/Id'
      required:
      - kind
      - id
      additionalProperties: false
    Source:
      type: object
      properties:
        kind:
          type: string
          enum:
          - lesson
          - question
        id:
          $ref: '#/components/schemas/Id'
        labelAtLink:
          type: string
          maxLength: 300
        currentLabel:
          type: string
          maxLength: 300
        deleted:
          type: boolean
      required:
      - kind
      - id
      - labelAtLink
      - currentLabel
      - deleted
    Course:
      type: object
      properties:
        classId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        lessonId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        recordIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
      required:
      - classId
      - lessonId
      - recordIds
      additionalProperties: false
    LinkedObject:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        labelAtLink:
          type: string
          maxLength: 300
        currentLabel:
          type: string
          maxLength: 300
        deleted:
          type: boolean
      required:
      - id
      - labelAtLink
      - currentLabel
      - deleted
    CourseState:
      type: object
      properties:
        classroom:
          anyOf:
          - $ref: '#/components/schemas/LinkedObject'
          - type: 'null'
        lesson:
          anyOf:
          - $ref: '#/components/schemas/LinkedObject'
          - type: 'null'
        records:
          type: array
          items:
            $ref: '#/components/schemas/LinkedObject'
      required:
      - classroom
      - lesson
      - records
    ClassInput:
      type: object
      properties:
        name: &id003
          type: string
          maxLength: 100
          minLength: 1
      required:
      - name
      additionalProperties: false
    ClassUpdate:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        name: *id003
      required:
      - expectedVersion
      - name
      additionalProperties: false
    ClassPurge:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
      required: [expectedVersion]
      additionalProperties: false
    ClassPurgeResult:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        permanentlyDeleted:
          type: boolean
          const: true
      required: [id, permanentlyDeleted]
    Class:
      type: object
      properties:
        id: &id012
          $ref: '#/components/schemas/Id'
        version: &id013
          $ref: '#/components/schemas/Version'
        createdAt: &id014
          $ref: '#/components/schemas/Timestamp'
        updatedAt: &id015
          $ref: '#/components/schemas/Timestamp'
        deletedAt: &id016
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        name: *id003
      required:
      - id
      - version
      - createdAt
      - updatedAt
      - deletedAt
      - name
    ClassList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Class'
      required:
      - items
    RecordInput:
      type: object
      properties:
        classId: &id004
          $ref: '#/components/schemas/Id'
        recordedOn: &id005
          $ref: '#/components/schemas/Date'
        note: &id006
          type: string
          maxLength: 10000
        position: &id007
          type: string
          maxLength: 10000
        unfinished: &id008
          type: string
          maxLength: 10000
        commonIssues: &id009
          type: string
          maxLength: 10000
        nextNote: &id010
          type: string
          maxLength: 10000
        sources: &id011
          type: array
          items:
            $ref: '#/components/schemas/SourceInput'
          maxItems: 100
      required:
      - classId
      - recordedOn
      - note
      - position
      - unfinished
      - commonIssues
      - nextNote
      - sources
      additionalProperties: false
      description: 至少一个文字项去空白非空；sources kind+id 唯一。classId 创建后不可改变。
    RecordUpdate:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        classId: *id004
        recordedOn: *id005
        note: *id006
        position: *id007
        unfinished: *id008
        commonIssues: *id009
        nextNote: *id010
        sources: *id011
      required:
      - expectedVersion
      - classId
      - recordedOn
      - note
      - position
      - unfinished
      - commonIssues
      - nextNote
      - sources
      additionalProperties: false
    Record:
      type: object
      properties:
        id: *id012
        version: *id013
        createdAt: *id014
        updatedAt: *id015
        deletedAt: *id016
        classId: *id004
        recordedOn: *id005
        note: *id006
        position: *id007
        unfinished: *id008
        commonIssues: *id009
        nextNote: *id010
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
      required:
      - id
      - version
      - createdAt
      - updatedAt
      - deletedAt
      - classId
      - recordedOn
      - note
      - position
      - unfinished
      - commonIssues
      - nextNote
      - sources
    RecordList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Record'
      required:
      - items
    Deletion:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        deleted:
          type: boolean
      required:
      - expectedVersion
      - deleted
      additionalProperties: false
    EntryInput:
      type: object
      properties:
        title: &entryTitle
          type: string
          maxLength: 300
        items: &entryItems
          type: array
          items:
            $ref: '#/components/schemas/Item'
          maxItems: 200
        time: &entryTime
          anyOf:
          - $ref: '#/components/schemas/Time'
          - type: 'null'
        repeat: &entryRepeat
          anyOf:
          - $ref: '#/components/schemas/Repeat'
          - type: 'null'
        course: &entryCourse
          $ref: '#/components/schemas/Course'
        reminder: &entryReminder
          anyOf:
          - $ref: '#/components/schemas/Reminder'
          - type: 'null'
      required:
      - title
      - items
      - time
      - repeat
      - course
      - reminder
      additionalProperties: false
      description: 标题非空或至少一个非空事项；事项 ID 在本 Entry 唯一。未排期 time=null 时 repeat/reminder=null，recordIds=[]。repeat 非空必须有
        time，模板 recordIds=[]。完整跨字段规则见契约入口。
    EntryUpdate:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        title: *entryTitle
        items: *entryItems
        time: *entryTime
        repeat: *entryRepeat
        course: *entryCourse
        reminder: *entryReminder
      required:
      - expectedVersion
      - title
      - items
      - time
      - repeat
      - course
      - reminder
      additionalProperties: false
    Entry:
      type: object
      properties:
        id: *id012
        version: *id013
        createdAt: *id014
        updatedAt: *id015
        deletedAt: *id016
        title:
          type: string
          maxLength: 300
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemView'
          maxItems: 200
        time:
          anyOf:
          - $ref: '#/components/schemas/TimeView'
          - type: 'null'
        repeat:
          anyOf:
          - $ref: '#/components/schemas/RepeatView'
          - type: 'null'
        course:
          $ref: '#/components/schemas/CourseView'
        reminder:
          anyOf:
          - $ref: '#/components/schemas/ReminderView'
          - type: 'null'
        courseState:
          $ref: '#/components/schemas/CourseState'
      required:
      - id
      - version
      - createdAt
      - updatedAt
      - deletedAt
      - title
      - items
      - time
      - repeat
      - course
      - reminder
      - courseState
    EntryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
      required:
      - items
    Settings:
      type: object
      properties:
        timeZone:
          $ref: '#/components/schemas/Zone'
        version:
          $ref: '#/components/schemas/Version'
      required:
      - timeZone
      - version
    SettingsUpdate:
      type: object
      properties:
        timeZone:
          $ref: '#/components/schemas/Zone'
        expectedVersion:
          $ref: '#/components/schemas/Version'
      required:
      - timeZone
      - expectedVersion
      additionalProperties: false
    OccurrenceKey:
      type: object
      properties:
        entryId:
          $ref: '#/components/schemas/Id'
        originDate:
          anyOf:
          - $ref: '#/components/schemas/Date'
          - type: 'null'
      required:
      - entryId
      - originDate
      additionalProperties: false
    Override:
      type: object
      properties:
        title: *entryTitle
        items: *entryItems
        time:
          $ref: '#/components/schemas/Time'
        course: *entryCourse
        reminder: *entryReminder
      required:
      - title
      - items
      - time
      - course
      - reminder
      additionalProperties: false
    SetOverride:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        mode:
          const: override
        content:
          $ref: '#/components/schemas/Override'
      required:
      - expectedVersion
      - mode
      - content
      additionalProperties: false
    SetCancelled:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        mode:
          const: cancelled
      required:
      - expectedVersion
      - mode
      additionalProperties: false
    ResetException:
      type: object
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        mode:
          const: inherit
      required:
      - expectedVersion
      - mode
      additionalProperties: false
    ExceptionInput:
      oneOf:
      - $ref: '#/components/schemas/SetOverride'
      - $ref: '#/components/schemas/SetCancelled'
      - $ref: '#/components/schemas/ResetException'
    Exception:
      type: object
      properties:
        originDate:
          $ref: '#/components/schemas/Date'
        mode:
          type: string
          enum:
          - override
          - cancelled
        eligible:
          type: boolean
        content:
          anyOf:
          - $ref: '#/components/schemas/OverrideView'
          - type: 'null'
      required:
      - originDate
      - mode
      - eligible
      - content
    ExceptionList:
      type: object
      properties:
        entryId:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
      required:
      - entryId
      - version
      - items
    Occurrence:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/OccurrenceKeyView'
        entryVersion:
          $ref: '#/components/schemas/Version'
        exception:
          type: boolean
        state:
          type: string
          enum:
          - active
          - cancelled
          - deleted
          - outside-series
        title:
          type: string
          maxLength: 300
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemView'
        time:
          $ref: '#/components/schemas/TimeView'
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        endsAt:
          $ref: '#/components/schemas/Timestamp'
        timeAdjusted:
          type: boolean
        course:
          $ref: '#/components/schemas/CourseView'
        courseState:
          $ref: '#/components/schemas/CourseState'
        reminder:
          anyOf:
          - $ref: '#/components/schemas/ReminderView'
          - type: 'null'
        dueAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - key
      - entryVersion
      - exception
      - state
      - title
      - items
      - time
      - startsAt
      - endsAt
      - timeAdjusted
      - course
      - courseState
      - reminder
      - dueAt
