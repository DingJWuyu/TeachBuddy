    Problem:
      type: object
      properties:
        type:
          type: string
          enum:
          - /problems/workbench/malformed-json
          - /problems/workbench/unauthenticated
          - /problems/workbench/request-not-allowed
          - /problems/workbench/not-found
          - /problems/workbench/version-conflict
          - /problems/workbench/idempotency-key-reused
          - /problems/workbench/object-deleted
          - /problems/workbench/invalid-input
          - /problems/workbench/payload-too-large
          - /problems/workbench/unsupported-media-type
          - /problems/workbench/temporarily-unavailable
          - /problems/workbench/invalid-time-zone
          - /problems/workbench/reminder-not-future
          - /problems/workbench/reference-deleted
          - /problems/workbench/class-mismatch
          - /problems/workbench/immutable-series
          - /problems/workbench/invalid-move
        status:
          type: integer
        currentVersion:
          $ref: '#/components/schemas/Version'
        objectId:
          $ref: '#/components/schemas/Id'
        field:
          type: string
          description: RFC6901 JSON Pointer，查询为 /query/<name>，请求头为 /headers/<name>。
        reason:
          type: string
          enum:
          - required
          - unknown-field
          - invalid-type
          - out-of-range
          - empty-content
          - duplicate-id
          - invalid-reference
          - unsupported-content-version
      required:
      - type
      description: B11公共错误形状保持；status可省略，若有则与HTTP一致。version-conflict必须currentVersion，冲突对象有UUID时另有objectId；settings冲突不带objectId。invalid-input必须field/reason；本批时间错误必须field。校验顺序见契约；单个确定错误按请求字段顺序返回，移动先源版本再目标版本。
      allOf:
      - if:
          properties:
            type:
              const: /problems/workbench/version-conflict
        then:
          required:
          - currentVersion
      - if:
          properties:
            type:
              enum:
              - /problems/workbench/invalid-input
              - /problems/workbench/invalid-time-zone
              - /problems/workbench/reminder-not-future
        then:
          required:
          - field
      - if:
          properties:
            type:
              enum: *id023
        then:
          properties:
            status:
              const: 400
      - if:
          properties:
            type:
              enum: *id024
        then:
          properties:
            status:
              const: 401
      - if:
          properties:
            type:
              enum: *id025
        then:
          properties:
            status:
              const: 403
      - if:
          properties:
            type:
              enum: *id026
        then:
          properties:
            status:
              const: 404
      - if:
          properties:
            type:
              enum: *id027
        then:
          properties:
            status:
              const: 409
      - if:
          properties:
            type:
              enum: *id028
        then:
          properties:
            status:
              const: 413
      - if:
          properties:
            type:
              enum: *id029
        then:
          properties:
            status:
              const: 415
      - if:
          properties:
            type:
              enum: *id030
        then:
          properties:
            status:
              const: 422
      - if:
          properties:
            type:
              enum: *id031
        then:
          properties:
            status:
              const: 503
      - if:
          properties:
            type:
              const: /problems/workbench/invalid-input
        then:
          required:
          - reason
