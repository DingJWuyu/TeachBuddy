<!-- @dsCard group="Content" height=230 subtitle="日程任务看板上的卡片" -->
<div class="demo">
  <style>
  :where(html){--tb-canvas:#f5f5f7;--tb-surface:#fff;--tb-surface-2:#fafafa;--tb-fill:#f0f0f2;--tb-fill-hover:#e8e8ed;--tb-line:#e2e2e7;--tb-line-soft:#ececef;--tb-ink:#1d1d1f;--tb-ink-2:#424245;--tb-muted:#6e6e73;--tb-faint:#86868b;--tb-brand:#0071e3;--tb-brand-soft:#e8f1fc;--tb-accent:#0066cc;--tb-accent-soft:#eef5fd;--tb-primary:#0071e3;--tb-primary-hover:#0077ed;--tb-on-primary:#fff;--tb-yellow:#ffd60a;--tb-yellow-soft:#fff8db;--tb-orange:#ff9500;--tb-coral:#ff9500;--tb-coral-soft:#fff4e5;--tb-lavender-deep:#af52de;--tb-lavender-soft:#f5f2fd;--tb-lavender-ink:#8a3fb8;--tb-blue:#0071e3;--tb-blue-soft:#e8f1fc;--tb-mint:#34c759;--tb-alert:#ff3b30;--tb-danger:#d70015;--tb-danger-soft:#fff0f0;--tb-warning-ink:#8a5a00;--tb-info:#0066cc;--tb-shadow-1:0 1px 2px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);--tb-shadow-2:0 12px 30px -14px rgb(0 0 0/.16),0 2px 6px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--tb-ink);background:var(--tb-canvas);-webkit-font-smoothing:antialiased}
  .demo{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:12px;padding:24px;background:var(--tb-accent-soft)}
  .card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:0;border-radius:16px;background:var(--tb-surface);box-shadow:var(--tb-shadow-1);text-align:left;font-family:inherit;color:var(--tb-ink);cursor:pointer;transition:transform 420ms cubic-bezier(.22,1,.36,1),box-shadow 420ms}
  .card:hover{transform:translateY(-2px);box-shadow:var(--tb-shadow-2)}
  .top{display:flex;justify-content:space-between;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--tb-ink-2)}
  .tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  time{padding:1px 8px;border-radius:999px;background:var(--tb-fill);font-size:11.5px;font-weight:650;color:var(--tb-ink-2)}
  strong{font-size:15px;font-weight:700}
  ul{display:grid;gap:4px;margin:2px 0 0;padding:0;list-style:none}
  li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tb-ink-2)}
  li b{flex:none;width:15px;height:15px;border:1.6px solid rgb(26 34 30/.3);border-radius:5px}
  li.done b{border-color:var(--tb-accent);background:var(--tb-accent)}
  li.done span{color:var(--tb-faint);text-decoration:line-through}
  em{margin-left:auto;padding:0 6px;border-radius:6px;background:var(--tb-danger-soft);color:var(--tb-danger);font-size:11px;font-style:normal;font-weight:700}
  .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--tb-muted)}
  </style>
  <button class="card"><span class="top"><span class="tag" style="--c:#ff9500"><i></i>教研</span><time>14:30 – 16:00</time></span><strong>数学组教研</strong><ul><li class="done"><b></b><span>分享分层作业设计</span></li><li><b></b><span>听课反馈</span><em>重要</em></li></ul><span class="foot"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#e3e6e1" stroke-width="3.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="#248a3d" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="56.5" stroke-dashoffset="28.3" transform="rotate(-90 12 12)"/></svg>1/2　三楼会议室</span></button>
  <button class="card"><span class="top"><span class="tag" style="--c:#af52de"><i></i>初三（5）班</span><time>10:10</time></span><strong>初三（5）班 数学</strong><ul><li><b></b><span>复习判别式</span></li></ul></button>
</div>
