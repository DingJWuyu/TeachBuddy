<!-- @dsCard group="Content" height=300 subtitle="题库列表里的一张题条：默认、悬停、选中" -->
<div class="demo">
  <style>
  :where(html){--tb-canvas:#f5f5f7;--tb-surface:#fff;--tb-surface-2:#fafafa;--tb-fill:#f0f0f2;--tb-fill-hover:#e8e8ed;--tb-line:#e2e2e7;--tb-line-soft:#ececef;--tb-ink:#1d1d1f;--tb-ink-2:#424245;--tb-muted:#6e6e73;--tb-faint:#86868b;--tb-brand:#0071e3;--tb-brand-soft:#e8f1fc;--tb-accent:#0066cc;--tb-accent-soft:#eef5fd;--tb-primary:#0071e3;--tb-primary-hover:#0077ed;--tb-on-primary:#fff;--tb-yellow:#ffd60a;--tb-yellow-soft:#fff8db;--tb-orange:#ff9500;--tb-coral:#ff9500;--tb-coral-soft:#fff4e5;--tb-lavender-deep:#af52de;--tb-lavender-soft:#f5f2fd;--tb-lavender-ink:#8a3fb8;--tb-blue:#0071e3;--tb-blue-soft:#e8f1fc;--tb-mint:#34c759;--tb-alert:#ff3b30;--tb-danger:#d70015;--tb-danger-soft:#fff0f0;--tb-warning-ink:#8a5a00;--tb-info:#0066cc;--tb-shadow-1:0 1px 2px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);--tb-shadow-2:0 12px 30px -14px rgb(0 0 0/.16),0 2px 6px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--tb-ink);background:var(--tb-canvas);-webkit-font-smoothing:antialiased}
  .demo{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:10px;padding:24px}
  .slip{position:relative;display:flex;flex-direction:column;gap:4px;padding:13px 14px 13px 16px;border:0;border-radius:15px;background:var(--tb-surface);text-align:left;font-family:inherit;color:var(--tb-ink);cursor:pointer;transition:background 120ms,box-shadow 220ms}
  .slip:hover{background:var(--tb-surface-2);box-shadow:inset 0 0 0 1px var(--tb-line-soft)}
  .slip.on{background:var(--tb-accent-soft)}
  .slip.on::after{content:"";position:absolute;top:16px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--tb-accent)}
  strong{font-size:14.5px;font-weight:650;line-height:1.45}
  p{margin:0;color:var(--tb-muted);font-size:13px;line-height:1.6}
  i{font-family:"Times New Roman",serif}
  .meta{display:flex;gap:5px;margin-top:6px}
  .t,.g{height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:22px}
  .t{background:var(--tb-accent-soft);color:var(--tb-accent)}.t.y{background:var(--tb-yellow-soft);color:var(--tb-warning-ink)}
  .on .g{background:rgb(255 255 255/.7)}
  .g{background:var(--tb-fill);color:var(--tb-muted)}
  </style>
  <button class="slip on"><strong>最值应用题</strong><p>某商品进价 40 元，售价 <i>x</i> 元时日销量为 (100 − <i>x</i>) 件。</p><span class="meta"><span class="t">解答题</span><span class="g">二次函数</span><span class="g">压轴</span></span></button>
  <button class="slip"><strong>二次函数图像平移</strong><p>把 <i>y</i> = 2<i>x</i>² 的图像向右平移 3 个单位，再向上平移 1 个单位。</p><span class="meta"><span class="t y">选择题</span><span class="g">二次函数</span></span></button>
  <button class="slip"><strong>判别式与根的个数</strong><p>关于 <i>x</i> 的方程 <i>x</i>² + 2<i>x</i> + <i>k</i> = 0 有两个不相等的实数根。</p><span class="meta"><span class="t">填空题</span><span class="g">易错</span></span></button>
</div>
