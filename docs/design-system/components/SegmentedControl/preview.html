<!-- @dsCard group="Navigation" height=150 subtitle="点一下，高亮块会滑过去" -->
<div class="demo">
  <style>
  :where(html){--tb-canvas:#f5f5f7;--tb-surface:#fff;--tb-surface-2:#fafafa;--tb-fill:#f0f0f2;--tb-fill-hover:#e8e8ed;--tb-line:#e2e2e7;--tb-line-soft:#ececef;--tb-ink:#1d1d1f;--tb-ink-2:#424245;--tb-muted:#6e6e73;--tb-faint:#86868b;--tb-brand:#0071e3;--tb-brand-soft:#e8f1fc;--tb-accent:#0066cc;--tb-accent-soft:#eef5fd;--tb-primary:#0071e3;--tb-primary-hover:#0077ed;--tb-on-primary:#fff;--tb-yellow:#ffd60a;--tb-yellow-soft:#fff8db;--tb-orange:#ff9500;--tb-coral:#ff9500;--tb-coral-soft:#fff4e5;--tb-lavender-deep:#af52de;--tb-lavender-soft:#f5f2fd;--tb-lavender-ink:#8a3fb8;--tb-blue:#0071e3;--tb-blue-soft:#e8f1fc;--tb-mint:#34c759;--tb-alert:#ff3b30;--tb-danger:#d70015;--tb-danger-soft:#fff0f0;--tb-warning-ink:#8a5a00;--tb-info:#0066cc;--tb-shadow-1:0 1px 2px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);--tb-shadow-2:0 12px 30px -14px rgb(0 0 0/.16),0 2px 6px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--tb-ink);background:var(--tb-canvas);-webkit-font-smoothing:antialiased}
  .demo{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:28px}
  .seg{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--tb-fill);box-shadow:inset 0 0 0 1px var(--tb-line-soft)}
  .thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--tb-surface);box-shadow:0 1px 2px rgb(20 34 28/.1),0 4px 12px -4px rgb(20 34 28/.14);transition:transform 460ms cubic-bezier(.22,1,.36,1),width 460ms cubic-bezier(.22,1,.36,1)}
  .seg button{position:relative;z-index:1;height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--tb-muted);font:600 14px/1 inherit;font-family:inherit;cursor:pointer;transition:color 220ms}
  .seg button[aria-pressed=true]{color:var(--tb-ink)}
  .seg.sq{border-radius:13px;padding:3px}.seg.sq .thumb{top:3px;bottom:3px;border-radius:10px}.seg.sq button{border-radius:10px;height:30px;padding:0 13px;font-size:13.5px}
  </style>
  <div class="seg" data-seg><span class="thumb"></span><button aria-pressed="true">首页</button><button aria-pressed="false">日程</button><button aria-pressed="false">支持</button></div>
  <div class="seg sq" data-seg><span class="thumb"></span><button aria-pressed="true">日历</button><button aria-pressed="false">任务</button></div>
  <script>
  document.querySelectorAll('[data-seg]').forEach(function (seg) {
    var thumb = seg.querySelector('.thumb');
    function place() { var on = seg.querySelector('[aria-pressed=true]'); thumb.style.width = on.offsetWidth + 'px'; thumb.style.transform = 'translateX(' + on.offsetLeft + 'px)'; }
    seg.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); place(); }); });
    requestAnimationFrame(place);
  });
  </script>
</div>
