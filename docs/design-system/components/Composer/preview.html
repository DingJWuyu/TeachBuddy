<!-- @dsCard group="Assistant" height=290 subtitle="教学助理输入框：常态与生成中" -->
<div class="demo">
  <style>
  :where(html){--tb-canvas:#f5f5f7;--tb-surface:#fff;--tb-surface-2:#fafafa;--tb-fill:#f0f0f2;--tb-fill-hover:#e8e8ed;--tb-line:#e2e2e7;--tb-line-soft:#ececef;--tb-ink:#1d1d1f;--tb-ink-2:#424245;--tb-muted:#6e6e73;--tb-faint:#86868b;--tb-brand:#0071e3;--tb-brand-soft:#e8f1fc;--tb-accent:#0066cc;--tb-accent-soft:#eef5fd;--tb-primary:#0071e3;--tb-primary-hover:#0077ed;--tb-on-primary:#fff;--tb-yellow:#ffd60a;--tb-yellow-soft:#fff8db;--tb-orange:#ff9500;--tb-coral:#ff9500;--tb-coral-soft:#fff4e5;--tb-lavender-deep:#af52de;--tb-lavender-soft:#f5f2fd;--tb-lavender-ink:#8a3fb8;--tb-blue:#0071e3;--tb-blue-soft:#e8f1fc;--tb-mint:#34c759;--tb-alert:#ff3b30;--tb-danger:#d70015;--tb-danger-soft:#fff0f0;--tb-warning-ink:#8a5a00;--tb-info:#0066cc;--tb-shadow-1:0 1px 2px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);--tb-shadow-2:0 12px 30px -14px rgb(0 0 0/.16),0 2px 6px rgb(0 0 0/.04),0 0 0 1px rgb(0 0 0/.04);}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--tb-ink);background:var(--tb-canvas);-webkit-font-smoothing:antialiased}
  @property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
  .demo{display:grid;gap:18px;padding:26px;max-width:640px}
  .box{border:1px solid var(--tb-line);border-radius:24px;background:var(--tb-surface);box-shadow:0 18px 40px -24px rgb(20 34 28/.35),0 2px 6px rgb(20 34 28/.04)}
  .box.run{border-color:transparent;background:linear-gradient(var(--tb-surface),var(--tb-surface)) padding-box,conic-gradient(from var(--a),#ff9500,#ff2d55,#af52de,#0a84ff,#34c759,#ff9500) border-box;animation:orbit 3s linear infinite}
  @keyframes orbit{to{--a:360deg}}
  .text{padding:18px 20px 6px;font-size:15.5px;line-height:1.6;color:var(--tb-faint)}
  .text.v{color:var(--tb-ink)}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 12px}
  .model{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;background:var(--tb-fill);font-size:12.5px;font-weight:600;color:var(--tb-ink-2)}
  .model i{width:7px;height:7px;border-radius:50%;background:var(--tb-mint);box-shadow:0 0 0 3px rgb(122 211 174/.25)}
  .hint{flex:1;font-size:12px;color:var(--tb-faint)}
  .send{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--tb-primary);color:#fff}
  .send.stop{background:var(--tb-ink)}
  </style>
  <div class="box"><div class="text">描述你想准备的课、想讨论的题，或想做的演示…</div><div class="bar"><span class="model"><i></i>DeepSeek</span><span class="hint">Enter 发送，Shift + Enter 换行</span><span class="send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></span></div></div>
  <div class="box run"><div class="text v">怎么讲二次函数的图像？</div><div class="bar"><span class="model"><i></i>DeepSeek</span><span class="hint">生成中</span><span class="send stop"><svg width="14" height="14" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></span></div></div>
</div>
