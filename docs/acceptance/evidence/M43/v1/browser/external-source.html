<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>M43 课堂探究</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 2rem; background: #fafafa; color: #222; }
  h1 { font-size: 1.6rem; }
  .controls { margin: 1rem 0; }
  label { margin-right: .5rem; font-weight: bold; }
  #k { vertical-align: middle; width: 300px; }
  .readout { font-size: 1.1rem; margin: .5rem 0; }
  .eq { font-family: Georgia, serif; font-style: italic; }
  svg { background: #fff; border: 1px solid #ccc; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .grid { stroke: #ddd; stroke-width: .5; }
  .line { stroke: #d33; stroke-width: 2.5; }
  .tick-label { font-size: 11px; fill: #555; }
  .axis-label { font-size: 14px; fill: #222; font-style: italic; }
</style>
</head>
<body>
<h1>M43 课堂探究</h1>
<div class="controls">
  <label for="k">系数 k（-8 到 8，步长 1）：</label>
  <input type="range" id="k" min="-10" max="8" step="1" value="2"
         aria-label="正比例函数系数 k" aria-describedby="kvalue">
</div>
<p class="readout">当前 k = <span id="kvalue">2</span></p>
<p class="readout">函数解析式：<span class="eq" id="eq">y = 2x</span></p>
<svg id="graph" width="480" height="480" viewBox="0 0 480 480" role="img"
     aria-label="函数 y=kx 的图像，坐标系范围 -10 到 10">
  <g id="grid"></g>
  <line class="axis" x1="240" y1="10" x2="240" y2="470"/>
  <line class="axis" x1="10" y1="240" x2="470" y2="240"/>
  <polygon points="240,10 235,20 245,20" fill="#333"/>
  <polygon points="470,240 460,235 460,245" fill="#333"/>
  <text class="axis-label" x="250" y="22">x</text>
  <text class="axis-label" x="222" y="24">y</text>
  <g id="ticks"></g>
  <line class="line" id="fline" x1="0" y1="0" x2="0" y2="0"/>
  <text class="eq" id="linelabel" x="0" y="0" font-size="16" fill="#d33">y = kx</text>
</svg>
<script>
(function () {
  var scale = 23; // 23 px per unit, range -10..10
  function toPx(x, y) { return [240 + x * scale, 240 - y * scale]; }

  // grid + ticks built once
  var grid = document.getElementById('grid');
  var ticks = document.getElementById('ticks');
  var NS = 'http://www.w3.org/2000/svg';
  for (var i = -10; i <= 10; i++) {
    if (i === 0) continue;
    var gv = toPx(i, 0)[0];
    var gh = toPx(0, i)[1];
    var v = document.createElementNS(NS, 'line');
    v.setAttribute('class', 'grid');
    v.setAttribute('x1', gv); v.setAttribute('y1', 10);
    v.setAttribute('x2', gv); v.setAttribute('y2', 470);
    grid.appendChild(v);
    var h = document.createElementNS(NS, 'line');
    h.setAttribute('class', 'grid');
    h.setAttribute('x1', 10); h.setAttribute('y1', gh);
    h.setAttribute('x2', 470); h.setAttribute('y2', gh);
    grid.appendChild(h);
    var tl = document.createElementNS(NS, 'text');
    tl.setAttribute('class', 'tick-label');
    tl.setAttribute('x', gv - 6); tl.setAttribute('y', 254);
    tl.textContent = i;
    ticks.appendChild(tl);
    var tt = document.createElementNS(NS, 'text');
    tt.setAttribute('class', 'tick-label');
    tt.setAttribute('x', 226); tt.setAttribute('y', gh + 4);
    tt.textContent = i;
    ticks.appendChild(tt);
  }

  var input = document.getElementById('k');
  var kvalue = document.getElementById('kvalue');
  var eq = document.getElementById('eq');
  var line = document.getElementById('fline');
  var label = document.getElementById('linelabel');

  function eqText(k) {
    if (k === 1) return 'y = x';
    if (k === -1) return 'y = -x';
    return 'y = ' + k + 'x';
  }

  function update() {
    var k = parseInt(input.value, 10);
    kvalue.textContent = k;
    var t = eqText(k);
    eq.textContent = t;
    // draw the line across x range clipped to viewbox
    var x1 = -10, y1 = k * x1;
    var x2 = 10, y2 = k * x2;
    // clip y to [-10, 10]: parametrize
    var pts = [];
    function add(x, y) { var p = toPx(x, y); pts.push(p[0] + ',' + p[1]); }
    if (k === 0) {
      add(-10, 0); add(10, 0);
    } else {
      var xmin = -10, xmax = 10;
      var ymin = k * xmin, ymax = k * xmax;
      // intersect with y in [-10,10]
      if (ymin < -10) { xmin = -10 / k; ymin = -10; }
      if (ymin > 10) { xmin = 10 / k; ymin = 10; }
      if (ymax > 10) { xmax = 10 / k; ymax = 10; }
      if (ymax < -10) { xmax = -10 / k; ymax = -10; }
      add(xmin, ymin); add(xmax, ymax);
    }
    line.setAttribute('x1', pts[0].split(',')[0]);
    line.setAttribute('y1', pts[0].split(',')[1]);
    line.setAttribute('x2', pts[1].split(',')[0]);
    line.setAttribute('y2', pts[1].split(',')[1]);

    // label placement: pick a sample point on the line, clamp into view
    var labelWidth = 70, labelHeight = 16, margin = 12;
    var lx = 8;
    var ly = k * lx;
    if (ly > 9) { ly = 9; lx = ly / k; }
    if (ly < -9) { ly = -9; lx = ly / k; }
    var p = toPx(lx, ly);
    var px = p[0] - labelWidth;
    var py = p[1] - labelHeight;
    if (k === 0) { py = p[1] - labelHeight; }
    // clamp inside the SVG viewport
    px = Math.min(Math.max(px, margin), 480 - margin - labelWidth);
    py = Math.min(Math.max(py, margin), 480 - margin - labelHeight);
    if (!isFinite(px)) px = 240;
    if (!isFinite(py)) py = 240;
    label.setAttribute('x', px);
    label.setAttribute('y', py);
    label.textContent = t;
  }

  input.addEventListener('input', update);
  update();
})();
</script>
</body>
</html>
