<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'self'; base-uri 'none'; form-action 'none'"><title>数学演示</title><style>body{margin:0;font:14px/1.5 sans-serif}header{display:flex;align-items:center;gap:12px;padding:8px;background:#f5f6f8}iframe{display:block;border:0;width:100%;height:calc(100vh - 70px)}button{padding:4px 10px}p{margin:0}</style></head><body><header><button>停止预览</button><p role="status">离线效果待检查。此作品需要外部资源时，当前预览可能不完整；执行异常可停止后编辑源码。</p></header><script>(function startIsolated(source, policy) {
  const doc = new DOMParser().parseFromString(source, "text/html");
  doc.querySelectorAll("base,meta[http-equiv]").forEach(node => node.remove());
  for (const node of doc.querySelectorAll("*")) for (const attr of [...node.attributes]) {
    if (["href", "xlink:href", "action", "formaction", "target", "download", "ping"].includes(attr.name.toLowerCase())) node.removeAttribute(attr.name);
  }
  const meta = doc.createElement("meta");
  meta.httpEquiv = "Content-Security-Policy";
  meta.content = policy;
  doc.head.prepend(meta);
  const monitor = doc.createElement("script");
  monitor.textContent = `for (const type of ['error','unhandledrejection','securitypolicyviolation']) addEventListener(type, () => parent.postMessage({mathPreviewFailure:true}, '*'));`;
  meta.after(monitor);
  const frame = document.createElement("iframe");
  frame.title = "隔离作品";
  frame.setAttribute("sandbox", "allow-scripts");
  let loads = 0;
  const notice = document.querySelector("[role=status]");
  window.addEventListener("message", event => {
    if (event.source === frame.contentWindow && event.data?.mathPreviewFailure === true) notice.textContent = "作品执行失败或依赖受限，预览可能不完整；可停止后编辑源码。离线效果待检查。";
  });
  frame.onload = () => {
    if (++loads > 1) {
      frame.remove();
      notice.textContent = "作品发生导航，预览已停止；源码仍保留。";
    }
  };
  document.querySelector("button").onclick = () => {
    frame.remove();
    notice.textContent = "预览已停止";
  };
  frame.srcdoc = "<!doctype html>" + doc.documentElement.outerHTML;
  document.body.append(frame);
})("\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>M43 课堂探究\u003c/title>\n\u003cstyle>\n  body { font-family: \"Microsoft YaHei\", sans-serif; margin: 2rem; background: #fafafa; color: #222; }\n  h1 { font-size: 1.6rem; }\n  .controls { margin: 1rem 0; }\n  label { margin-right: .5rem; font-weight: bold; }\n  #k { vertical-align: middle; width: 300px; }\n  .readout { font-size: 1.1rem; margin: .5rem 0; }\n  .eq { font-family: Georgia, serif; font-style: italic; }\n  svg { background: #fff; border: 1px solid #ccc; }\n  .axis { stroke: #333; stroke-width: 1.5; }\n  .grid { stroke: #ddd; stroke-width: .5; }\n  .line { stroke: #d33; stroke-width: 2.5; }\n  .tick-label { font-size: 11px; fill: #555; }\n  .axis-label { font-size: 14px; fill: #222; font-style: italic; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ch1>M43 课堂探究\u003c/h1>\n\u003cdiv class=\"controls\">\n  \u003clabel for=\"k\">系数 k（-8 到 8，步长 1）：\u003c/label>\n  \u003cinput type=\"range\" id=\"k\" min=\"-10\" max=\"8\" step=\"1\" value=\"2\"\n         aria-label=\"正比例函数系数 k\" aria-describedby=\"kvalue\">\n\u003c/div>\n\u003cp class=\"readout\">当前 k = \u003cspan id=\"kvalue\">2\u003c/span>\u003c/p>\n\u003cp class=\"readout\">函数解析式：\u003cspan class=\"eq\" id=\"eq\">y = 2x\u003c/span>\u003c/p>\n\u003csvg id=\"graph\" width=\"480\" height=\"480\" viewBox=\"0 0 480 480\" role=\"img\"\n     aria-label=\"函数 y=kx 的图像，坐标系范围 -10 到 10\">\n  \u003cg id=\"grid\">\u003c/g>\n  \u003cline class=\"axis\" x1=\"240\" y1=\"10\" x2=\"240\" y2=\"470\"/>\n  \u003cline class=\"axis\" x1=\"10\" y1=\"240\" x2=\"470\" y2=\"240\"/>\n  \u003cpolygon points=\"240,10 235,20 245,20\" fill=\"#333\"/>\n  \u003cpolygon points=\"470,240 460,235 460,245\" fill=\"#333\"/>\n  \u003ctext class=\"axis-label\" x=\"250\" y=\"22\">x\u003c/text>\n  \u003ctext class=\"axis-label\" x=\"222\" y=\"24\">y\u003c/text>\n  \u003cg id=\"ticks\">\u003c/g>\n  \u003cline class=\"line\" id=\"fline\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\"/>\n  \u003ctext class=\"eq\" id=\"linelabel\" x=\"0\" y=\"0\" font-size=\"16\" fill=\"#d33\">y = kx\u003c/text>\n\u003c/svg>\n\u003cscript>\n(function () {\n  var scale = 23; // 23 px per unit, range -10..10\n  function toPx(x, y) { return [240 + x * scale, 240 - y * scale]; }\n\n  // grid + ticks built once\n  var grid = document.getElementById('grid');\n  var ticks = document.getElementById('ticks');\n  var NS = 'http://www.w3.org/2000/svg';\n  for (var i = -10; i \u003c= 10; i++) {\n    if (i === 0) continue;\n    var gv = toPx(i, 0)[0];\n    var gh = toPx(0, i)[1];\n    var v = document.createElementNS(NS, 'line');\n    v.setAttribute('class', 'grid');\n    v.setAttribute('x1', gv); v.setAttribute('y1', 10);\n    v.setAttribute('x2', gv); v.setAttribute('y2', 470);\n    grid.appendChild(v);\n    var h = document.createElementNS(NS, 'line');\n    h.setAttribute('class', 'grid');\n    h.setAttribute('x1', 10); h.setAttribute('y1', gh);\n    h.setAttribute('x2', 470); h.setAttribute('y2', gh);\n    grid.appendChild(h);\n    var tl = document.createElementNS(NS, 'text');\n    tl.setAttribute('class', 'tick-label');\n    tl.setAttribute('x', gv - 6); tl.setAttribute('y', 254);\n    tl.textContent = i;\n    ticks.appendChild(tl);\n    var tt = document.createElementNS(NS, 'text');\n    tt.setAttribute('class', 'tick-label');\n    tt.setAttribute('x', 226); tt.setAttribute('y', gh + 4);\n    tt.textContent = i;\n    ticks.appendChild(tt);\n  }\n\n  var input = document.getElementById('k');\n  var kvalue = document.getElementById('kvalue');\n  var eq = document.getElementById('eq');\n  var line = document.getElementById('fline');\n  var label = document.getElementById('linelabel');\n\n  function eqText(k) {\n    if (k === 1) return 'y = x';\n    if (k === -1) return 'y = -x';\n    return 'y = ' + k + 'x';\n  }\n\n  function update() {\n    var k = parseInt(input.value, 10);\n    kvalue.textContent = k;\n    var t = eqText(k);\n    eq.textContent = t;\n    // draw the line across x range clipped to viewbox\n    var x1 = -10, y1 = k * x1;\n    var x2 = 10, y2 = k * x2;\n    // clip y to [-10, 10]: parametrize\n    var pts = [];\n    function add(x, y) { var p = toPx(x, y); pts.push(p[0] + ',' + p[1]); }\n    if (k === 0) {\n      add(-10, 0); add(10, 0);\n    } else {\n      var xmin = -10, xmax = 10;\n      var ymin = k * xmin, ymax = k * xmax;\n      // intersect with y in [-10,10]\n      if (ymin \u003c -10) { xmin = -10 / k; ymin = -10; }\n      if (ymin > 10) { xmin = 10 / k; ymin = 10; }\n      if (ymax > 10) { xmax = 10 / k; ymax = 10; }\n      if (ymax \u003c -10) { xmax = -10 / k; ymax = -10; }\n      add(xmin, ymin); add(xmax, ymax);\n    }\n    line.setAttribute('x1', pts[0].split(',')[0]);\n    line.setAttribute('y1', pts[0].split(',')[1]);\n    line.setAttribute('x2', pts[1].split(',')[0]);\n    line.setAttribute('y2', pts[1].split(',')[1]);\n\n    // label placement: pick a sample point on the line, clamp into view\n    var labelWidth = 70, labelHeight = 16, margin = 12;\n    var lx = 8;\n    var ly = k * lx;\n    if (ly > 9) { ly = 9; lx = ly / k; }\n    if (ly \u003c -9) { ly = -9; lx = ly / k; }\n    var p = toPx(lx, ly);\n    var px = p[0] - labelWidth;\n    var py = p[1] - labelHeight;\n    if (k === 0) { py = p[1] - labelHeight; }\n    // clamp inside the SVG viewport\n    px = Math.min(Math.max(px, margin), 480 - margin - labelWidth);\n    py = Math.min(Math.max(py, margin), 480 - margin - labelHeight);\n    if (!isFinite(px)) px = 240;\n    if (!isFinite(py)) py = 240;\n    label.setAttribute('x', px);\n    label.setAttribute('y', py);\n    label.textContent = t;\n  }\n\n  input.addEventListener('input', update);\n  update();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'");</script></body></html>
