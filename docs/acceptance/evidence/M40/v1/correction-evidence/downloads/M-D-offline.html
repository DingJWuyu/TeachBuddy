<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-D 离线二次函数演示</title>
<style>body{margin:0;padding:24px;background:#f1f5f9;color:#0f172a;font:16px/1.5 system-ui,"Noto Sans CJK SC",sans-serif}main{max-width:760px;margin:auto;background:white;padding:20px;border-radius:16px;box-shadow:0 12px 30px #0f172a22}h1{margin-top:0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:grid;gap:4px;font-size:13px}input[type=range]{accent-color:#0e7490}button{border:1px solid #0e7490;background:white;border-radius:8px;padding:7px 10px;cursor:pointer}.steps{display:flex;gap:6px;flex-wrap:wrap}.steps button.on{background:#0e7490;color:white}svg{display:block;width:100%;height:auto;background:#dbeafe;border-radius:10px;margin-top:16px}.note{color:#475569;font-size:13px}@media(max-width:600px){.controls{grid-template-columns:1fr}}</style></head>
<body><main><h1>M-D：参数二次函数（离线）</h1><p class="note">此文件不依赖服务器、CDN 或工作台登录；范围、步长与步骤文字来自保存源。顶点支持鼠标拖动和方向键。</p><div class="controls"><label><span>a = <output id="av"></output></span><input id="a" type="range" min="-2" max="2" step="1"></label><label><span>h = <output id="hv"></output></span><input id="h" type="range" min="-4" max="4" step="0.5"></label><label><span>k = <output id="kv"></output></span><input id="k" type="range" min="-4" max="4" step="0.5"></label></div><p id="eq"></p><div class="steps"><button data-s="1">1 母函数</button><button data-s="2">2 平移</button><button data-s="3">3 解析式</button></div><svg id="svg" viewBox="0 0 520 340" tabindex="0" aria-label="离线二次函数图"></svg><p id="checks" class="note"></p></main>
<script>

function dynFmt(value) {
  const n = Number(value);
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, '');
}
function dynProject(x, y) {
  return [60 + ((x + 5) / 10) * 400, 28 + ((6 - y) / 12) * 280];
}
function dynQuantize(value, range) {
  const clamped = Math.min(range.max, Math.max(range.min, Number(value)));
  const snapped = range.min + Math.round((clamped - range.min) / range.step) * range.step;
  return Number(Math.min(range.max, Math.max(range.min, snapped)).toFixed(4));
}
function dynVertex(step, h, k) {
  return Number(step) === 1 ? [0, 0] : [h, k];
}
function dynCurveY(step, a, h, k, x) {
  if (Number(step) === 1) return x * x;
  return a * (x - h) * (x - h) + k;
}
function dynEquation(step, a, h, k) {
  if (Number(step) === 1) return 'y = x²';
  return 'y = ' + dynFmt(a) + '(x - ' + dynFmt(h) + ')² + ' + dynFmt(k);
}
function dynSamplePoints(step, a, h, k) {
  if (Number(step) !== 3) return [];
  if (a === 1 && h === 1 && k === -4) return [[-1, 0], [3, 0]];
  if (a === -2 && h === 0 && k === 1) return [[1, -1]];
  return [];
}
function dynPathData(step, a, h, k) {
  const points = [];
  for (let x = -5; x <= 5; x += 0.04) {
    const y = dynCurveY(step, a, h, k, x);
    if (y >= -6.2 && y <= 6.2) points.push(dynProject(x, y));
  }
  return points.map((point, index) => (index ? 'L' : 'M') + ' ' + point[0].toFixed(2) + ' ' + point[1].toFixed(2)).join(' ');
}

(function(){const s={"a":1,"h":1,"k":-4,"step":2,"ranges":{"a":{"min":-2.5,"max":2.5,"step":0.5},"h":{"min":-4,"max":4,"step":0.5},"k":{"min":-4,"max":4,"step":0.5}},"stepTitles":{"1":"1 母函数","2":"2 平移与顶点","3":"3 解析式"}};const N='http://www.w3.org/2000/svg';let drag=false;const q=(x)=>document.querySelector(x);function e(n,a,t){const z=document.createElementNS(N,n);Object.entries(a||{}).forEach(([k,v])=>z.setAttribute(k,v));if(t)z.textContent=t;return z}function title(i){return (s.stepTitles&&s.stepTitles[i])||String(i)}function draw(){['a','h','k'].forEach((key)=>{const slider=q('#'+key);slider.min=s.ranges[key].min;slider.max=s.ranges[key].max;slider.step=s.ranges[key].step;slider.value=s[key];q('#'+key+'v').value=dynFmt(s[key])});const [vx,vy]=dynVertex(s.step,s.h,s.k);q('#eq').textContent=dynEquation(s.step,s.a,s.h,s.k);q('#checks').textContent='顶点 ('+dynFmt(vx)+','+dynFmt(vy)+')；当前第 '+s.step+' 步（'+title(s.step)+'）。文件已内嵌全部图形代码。';document.querySelectorAll('[data-s]').forEach(b=>{const i=Number(b.dataset.s);b.textContent=title(i);b.classList.toggle('on',i===s.step)});const svg=q('#svg');svg.innerHTML='';for(let x=-5;x<=5;x++){const [gx]=dynProject(x,0);svg.append(e('line',{x1:gx,y1:28,x2:gx,y2:308,stroke:x===0?'#334155':'#b6c9de','stroke-width':x===0?1.8:.7}))}for(let y=-6;y<=6;y++){const [,gy]=dynProject(0,y);svg.append(e('line',{x1:60,y1:gy,x2:460,y2:gy,stroke:y===0?'#334155':'#b6c9de','stroke-width':y===0?1.8:.7}))}const pathData=dynPathData(s.step,s.a,s.h,s.k);if(pathData)svg.append(e('path',{d:pathData,fill:'none',stroke:'#0e7490','stroke-width':3.5}));const [cx,cy]=dynProject(vx,vy);const c=e('circle',{cx,cy,r:9,fill:'#be123c',stroke:'#fff','stroke-width':3,tabindex:0,role:'slider'});c.addEventListener('pointerdown',()=>{drag=true});window.addEventListener('pointerup',()=>{drag=false});svg.addEventListener('pointermove',(ev)=>{if(!drag)return;const r=svg.getBoundingClientRect();const mx=(ev.clientX-r.left)/r.width*520,my=(ev.clientY-r.top)/r.height*340;s.h=dynQuantize(((mx-60)/400)*10-5,s.ranges.h);s.k=dynQuantize(6-((my-28)/280)*12,s.ranges.k);draw()});c.addEventListener('keydown',(ev)=>{const dh=(ev.shiftKey?5:1)*s.ranges.h.step,dk=(ev.shiftKey?5:1)*s.ranges.k.step;if(ev.key==='ArrowLeft')s.h=dynQuantize(s.h-dh,s.ranges.h);else if(ev.key==='ArrowRight')s.h=dynQuantize(s.h+dh,s.ranges.h);else if(ev.key==='ArrowUp')s.k=dynQuantize(s.k+dk,s.ranges.k);else if(ev.key==='ArrowDown')s.k=dynQuantize(s.k-dk,s.ranges.k);else return;ev.preventDefault();draw()});svg.append(c);svg.append(e('text',{x:cx+13,y:cy-12,fill:'#881337','font-size':13,'font-weight':700},'顶点 ('+dynFmt(vx)+','+dynFmt(vy)+')'));dynSamplePoints(s.step,s.a,s.h,s.k).forEach(([sx,sy])=>{const [px,py]=dynProject(sx,sy);svg.append(e('circle',{cx:px,cy:py,r:5,fill:'#166534',stroke:'#fff','stroke-width':2}))})}['a','h','k'].forEach(id=>q('#'+id).addEventListener('input',()=>{s[id]=Number(q('#'+id).value);draw()}));document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{s.step=Number(b.dataset.s);draw()}));draw()})()</script></body></html>
