name: 使用问题
description: 记录真实入口、复现步骤和预期结果
labels: [bug, needs-triage]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现
      description: 使用入口、操作步骤、输入和当前结果。请不要上传账户凭据或私密材料。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与证据
      description: 应用版本、设备、浏览器、时间及可分享的错误信息。
