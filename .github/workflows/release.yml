name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and package without publishing a Tag or GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: Check release scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main for publication
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo '::error::Only main may publish. Use dry_run on the development trunk.'
            exit 1
          fi
  verify:
    name: Verify release
    needs: scope
    uses: ./.github/workflows/ci.yml
    with:
      release_artifact: true
  publish:
    name: Publish or rehearse
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify archive and publish the fixed commit
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.sha256
          tar -tzf ./*.tar.gz > "$RUNNER_TEMP/release-files.txt"
          if [[ "$DRY_RUN" == "true" ]]; then
            printf 'Rehearsal only: %s at %s\nNo Tag, GitHub Release or deployment was created.\n' \
              "$tag" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            cd "$GITHUB_WORKSPACE"
            gh auth setup-git
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            cd "$RUNNER_TEMP/release"
            gh release create "$tag" ./*.tar.gz ./*.sha256 \
              --verify-tag --title "$tag" --generate-notes --fail-on-no-commits
            printf 'Published %s at %s.\n' "$tag" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nCD is pending: deployment host, domain, production configuration and backup destination are not configured.\n' \
            >> "$GITHUB_STEP_SUMMARY"
