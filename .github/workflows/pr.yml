name: PR

on:
  pull_request:
    branches: [preview/integration, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the development trunk for stable releases
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$BASE_BRANCH" == "main" ]] &&
             [[ "$HEAD_BRANCH" != "preview/integration" || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Release PRs must promote preview/integration from this repository.'
            exit 1
          fi
