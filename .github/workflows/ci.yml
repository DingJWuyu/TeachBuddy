name: CI

on:
  pull_request:
    branches: [preview/integration, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release_artifact }}

jobs:
  build-and-api:
    name: Build and API
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build local math runtime
        if: hashFiles('tools/geogebra/manifest.json') != ''
        run: npm run math:geogebra:build
      - name: Build all workspaces
        run: npm run build
      - name: Verify HTTP and SQLite integration
        # Browser E2E and Office/PDF/OCR output are verified locally for
        # affected changes and recorded in the PR. This group uses fake mail
        # and local model providers, without private configuration or GPUs.
        # test:ci excludes four named cases: auth-contract-https's browser
        # cookie test, reliability-export-ownership's lesson-output test
        # (LibreOffice/PDF conversion), and its two OCR replay tests
        # (which require the external Bubblewrap image preparation sandbox).
        # The real HTTPS test and all remaining export-ownership cases run.
        run: npm run test:ci
      - name: Package the verified application
        if: inputs.release_artifact
        run: |
          version=$(node -p 'require("./package.json").version')
          archive="teacherworkspace-$version-$GITHUB_SHA.tar.gz"
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/REVISION"
          tar -czf "$RUNNER_TEMP/release/$archive" \
            -C "$RUNNER_TEMP" REVISION -C "$GITHUB_WORKSPACE" \
            LICENSE package.json package-lock.json .env.example \
            apps/api/package.json apps/api/src \
            apps/web/package.json apps/web/dist \
            packages/shared/package.json packages/shared/src
          cd "$RUNNER_TEMP/release"
          sha256sum "$archive" > "$archive.sha256"
      - name: Retain the verified release artifact
        if: inputs.release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
