name: CI

on:
  pull_request:
    branches: [preview/integration, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release_artifact }}

jobs:
  api:
    name: HTTP and SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Verify HTTP and SQLite integration
        shell: bash
        run: |
          mkdir -p test-results/ci
          npm run test:ci 2>&1 | tee test-results/ci/api.log
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-api-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  browser-and-outputs:
    name: Build, browser and outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WORKBENCH_WEB_DIST: apps/web/dist
      MATERIALS_PANDOC_PATH: /usr/bin/pandoc
      MATERIALS_OFFICE_ROOT: /usr/lib/libreoffice
      MATH_INTEGRATION_EVIDENCE: test-results/math-integration/outputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore the pinned math runtime
        id: math-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/vendor/math/geogebra
          key: ${{ runner.os }}-${{ runner.arch }}-geogebra-v1-${{ hashFiles('tools/geogebra/**', '!tools/geogebra/.cache/**', 'scripts/math-support/geogebra-*.py') }}
      - name: Validate or build the local math runtime
        # Always check the input fingerprint and every output digest, even on a cache hit.
        run: npm run math:geogebra:build
      - name: Cache the validated math runtime
        if: steps.math-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/vendor/math/geogebra
          key: ${{ steps.math-cache.outputs.cache-primary-key }}
      - name: Install browser and document tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils bubblewrap fonts-noto-cjk
          curl --fail --location --retry 2 \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb \
            -o "$RUNNER_TEMP/pandoc.deb"
          printf '%s  %s\n' '89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99' "$RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          npx playwright install --with-deps chromium
          pandoc --version
          libreoffice --version
          # Ubuntu's default AppArmor userns policy blocks Bubblewrap's loopback setup.
          # Allow only this executable on the disposable runner; product sandbox
          # mounts, network isolation and capability dropping still apply.
          cat > "$RUNNER_TEMP/bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/bwrap.apparmor"
          bwrap --unshare-all --ro-bind / / /usr/bin/true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { generateDocx } from './apps/api/src/modules/lessons/pandoc.js';
          import { convertFile } from './apps/api/src/workbench/files/converter.js';
          const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'ci-document-tools-'));
          const bytes = await generateDocx([{ type: 'math', latex: 'x^2+1' }], {
            files: { temporaryDirectory: () => fs.mkdtempSync(path.join(directory, 'pandoc-')) }, principal: {},
          });
          const result = await convertFile({ bytes, directory,
            mediaType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
          if (!result.pdf || !result.pages.length) throw new Error('Document toolchain produced no PDF pages');
          fs.rmSync(directory, { recursive: true });
          JS
      - name: Build all workspaces
        run: npm run build
      - name: Verify real files, offline math and browser cookies
        shell: bash
        run: |
          mkdir -p test-results/ci
          npm run test:ci:outputs 2>&1 | tee test-results/ci/outputs.log
      - name: Verify browser workflows
        shell: bash
        run: npm run test:ci:browser 2>&1 | tee test-results/ci/browser.log
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-browser-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
      - name: Package the verified application
        if: inputs.release_artifact
        run: |
          version=$(node -p 'require("./package.json").version')
          archive="teacherworkspace-$version-$GITHUB_SHA.tar.gz"
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/REVISION"
          tar -czf "$RUNNER_TEMP/release/$archive" \
            -C "$RUNNER_TEMP" REVISION -C "$GITHUB_WORKSPACE" \
            LICENSE package.json package-lock.json .env.example \
            apps/api/package.json apps/api/src \
            apps/web/package.json apps/web/dist \
            packages/shared/package.json packages/shared/src
          cd "$RUNNER_TEMP/release"
          sha256sum "$archive" > "$archive.sha256"
      - name: Retain the verified release artifact
        if: inputs.release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  build-and-api:
    # Keep the existing required check; neither job may fail or be skipped.
    name: Build and API
    needs: [api, browser-and-outputs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      API_RESULT: ${{ needs.api.result }}
      BROWSER_RESULT: ${{ needs.browser-and-outputs.result }}
    steps:
      - run: test "$API_RESULT" = success && test "$BROWSER_RESULT" = success
