name: Prepare release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: SemVer increment (auto follows Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Preview the version and changelog without committing or pushing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version on trunk
    if: github.ref == 'refs/heads/preview/integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: preview/integration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Generate version and changelog with release-it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh auth setup-git
          release_args=(--ci)
          if [[ "$INCREMENT" != "auto" ]]; then
            release_args+=("$INCREMENT" --plugins.@release-it/conventional-changelog.ignoreRecommendedBump)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            release_args+=(--dry-run)
          fi
          npm run release:prepare -- "${release_args[@]}"
      - name: Commit the prepared version to trunk
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if [[ -f CHANGELOG.md ]]; then
            git add -- CHANGELOG.md
          fi
          if git diff --cached --quiet; then
            printf 'No version changes were generated.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -p 'require("./package.json").version')
          git commit -m "chore(release): prepare $version"
          git push origin HEAD:refs/heads/preview/integration
          printf 'Prepared %s at %s on preview/integration.\n\nCreate a Release PR from preview/integration to main; continue within existing explicit publication authorization, or request it if only preparation was authorized.\n' \
            "$version" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
