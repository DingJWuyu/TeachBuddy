name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact target version specified by the user (for example, 1.0.0)
        type: string
        required: true
      dry_run:
        description: Preview the version and changelog without committing or pushing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version on trunk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Prepare and push the version with release-it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node <<'NODE'
          const semver = require('semver');
          const version = process.env.RELEASE_VERSION;
          if (!semver.valid(version) || !semver.gt(version, require('./package.json').version)) {
            throw new Error('Provide a complete target SemVer newer than the current version.');
          }
          NODE
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          release_args=("$RELEASE_VERSION" --ci)
          if [[ "$DRY_RUN" == "true" ]]; then
            release_args+=(--dry-run)
          fi
          npm run release:prepare -- "${release_args[@]}"
