                  - $ref: '#/components/schemas/UnknownFieldProblem'
                  - $ref: '#/components/schemas/RequiredFieldProblem'
                  - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                  - $ref: '#/components/schemas/InvalidFieldValueProblem'
                - properties:
                    field:
                      enum:
                      - sessionId
        '503':
          description: 本操作的拒绝；首错及无副作用保证见 auth.md。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SessionStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
        '409':
          $ref: '#/components/responses/BrowserContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              sample:
                $ref: '#/components/examples/Logout'
  /api/auth/account-deletion:
    post:
      operationId: deleteAccount
      summary: 删除当前账户并核实原请求结果
      x-interaction-id: I08
      x-contract-status: candidate
      description: 首次必须为当前页面的真实 active 会话并确认账户邮箱。先撤销全部会话、锁定账户，完成全部受管数据清理才返回204；失败或未知必须保留原请求和Cookie核实。重复仅由原Cookie与完全相同body证明，不授予业务身份。详见auth.md的I08。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: 账户和受管资料已清理，或原请求已确认完成；无body，不清容器Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/session-invalid
        '409':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/browser-context-required
                      - /problems/auth/deletion-in-progress
        '422':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/invalid-request-body
                      - /problems/auth/unknown-field
                      - /problems/auth/required-field
                      - /problems/auth/invalid-field-type
                      - /problems/auth/invalid-field-value
                      - /problems/auth/email-empty
                      - /problems/auth/email-invalid-format
                      - /problems/auth/deletion-confirmation-mismatch
        '503':
          description: 删除未完成或存储不可用；不承诺回滚，保持原请求核实。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/deletion-incomplete
                      - /problems/auth/account-store-unavailable
                      - /problems/auth/service-unavailable
  /api/auth/profile:
    post:
      operationId: updateProfile
      summary: 修改当前已登录账户的昵称
      x-interaction-id: I09
      x-contract-status: candidate
      description: Cookie 与 PageContext 必须绑定有效 active 会话。只更新该账户昵称，不改变邮箱、会话或记住我。后完成的显式修改生效；响应丢失先通过 I06 读取核实，不自动重放写入。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname]
              properties:
                nickname:
                  $ref: '#/components/schemas/NicknameInput'
      responses:
        '200':
          description: 已保存的账户资料；不设置 Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '409':
          $ref: '#/components/responses/BrowserContextRequired'
        '422':
          description: 封闭请求形状或昵称校验失败，未修改账户。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InvalidRequestBodyProblem'
                - $ref: '#/components/schemas/UnknownFieldProblem'
                - $ref: '#/components/schemas/RequiredFieldProblem'
                - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                - $ref: '#/components/schemas/InvalidFieldValueProblem'
                - $ref: '#/components/schemas/NicknameEmptyProblem'
                - $ref: '#/components/schemas/NicknameTooLongProblem'
        '503':
          description: 存储或服务不可用，修改事务回滚。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountStoreUnavailableProblem'
                - $ref: '#/components/schemas/SessionStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-teachbuddy_session
      description: HttpOnly; Secure; Path=/; SameSite=Lax；不设 Domain。只由浏览器自动携带，不返回或存入前端。Cookie容器与页面上下文共同选择服务端会话；只有active且未到期/撤销才能授权。见
        auth.md。
  parameters:
    BrowserRequestProtection:
      name: X-TeachBuddy-Request
      in: header
      required: true
      schema:
        type: string
        const: '1'
      description: 固定非秘密保护头；缺失/不符返回403，先于业务。
    RequestOrigin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
      description: 浏览器管理；有值时严格匹配可信公开来源；null/错误不回退。仅缺失才用 Referer。
    RequestReferer:
      name: Referer
      in: header
      required: false
      schema:
        type: string
      description: 仅 Origin 缺失时解析完整来源；两者皆无或来源不符拒绝。
    PageContext:
      name: X-TeachBuddy-Page
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/PageContext'
      example: '0123456789abcdef0123456789abcdef'
      description: 只选择 Cookie 内当前页面绑定，不能单独授权；由认证 transport 同样附于工作台请求。认证操作缺失/形状错误为409 browser-context-required；工作台缺失/形状错误或无有效绑定由身份门禁返回401 workbench/unauthenticated，写来源防护仍先于身份。
  headers:
    AuthCacheControl:
      required: true
      schema:
        type: string
        const: no-store
      description: 所有认证响应必需。
    SessionSetCookie:
      schema:
        type: string
      description: 仅 bootstrap/remembered 激活或最终清除时出现。固定 __Host-teachbuddy_session，HttpOnly; Secure; Path=/;
        SameSite=Lax，无 Domain。bootstrap 无到期属性；remembered Max-Age<=604800 且不超过剩余绝对期限；清除 Max-Age=0。见 auth.md。
    RetryAfter:
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 30
      description: 剩余冷却向上取整秒数，与 body retryAfterSeconds 相同。
  responses:
    RequestNotAllowed:
      description: 来源/保护头拒绝，无业务副作用。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RequestNotAllowedProblem'
          examples:
            sample:
              $ref: '#/components/examples/RequestNotAllowed'
    MalformedJson:
      description: JSON 解析失败，包括空 body。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MalformedJsonProblem'
          examples:
            sample:
              $ref: '#/components/examples/MalformedJson'
    UnsupportedMediaType:
      description: POST 只接受 application/json，可带 UTF-8 charset。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnsupportedMediaTypeProblem'
          examples:
            sample:
              $ref: '#/components/examples/UnsupportedMediaType'
    InvalidRequestBody:
      description: JSON 根不是对象。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidRequestBodyProblem'
          examples:
            sample:
              $ref: '#/components/examples/InvalidRequestBody'
    UnknownField:
      description: 含当前操作未声明的 JSON 属性。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnknownFieldProblem'
          examples:
            sample:
              $ref: '#/components/examples/UnknownField'
    RequiredField:
      description: 缺少必填属性，按 required 顺序定位。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RequiredFieldProblem'
          examples:
            sample:
              $ref: '#/components/examples/RequiredField'
    InvalidFieldType:
      description: JSON 类型不符；不进行隐式转换。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidFieldTypeProblem'
          examples:
            sample:
              $ref: '#/components/examples/InvalidFieldType'
    InvalidFieldValue:
      description: 命令 action/标识形状不符；已命名业务字段错误优先使用专有 type。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidFieldValueProblem'
          examples:
            sample:
              $ref: '#/components/examples/InvalidFieldValue'
    EmailEmpty:
      description: 规范化后邮箱为空。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EmailEmptyProblem'
          examples:
            sample:
              $ref: '#/components/examples/EmailEmpty'
    EmailInvalidFormat:
      description: 规范邮箱形状或254总长度/各段边界不符。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EmailInvalidFormatProblem'
          examples:
            sample:
              $ref: '#/components/examples/EmailInvalidFormat'
    NicknameEmpty:
      description: trim 后昵称为空。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NicknameEmptyProblem'
          examples:
            sample:
              $ref: '#/components/examples/NicknameEmpty'
    NicknameTooLong:
      description: trim 后超过40个 code points。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NicknameTooLongProblem'
          examples:
            sample:
              $ref: '#/components/examples/NicknameTooLong'
    PasswordTooShort:
      description: 少于8个 code points。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordTooShortProblem'
          examples:
            sample:
              $ref: '#/components/examples/PasswordTooShort'
    PasswordTooLong:
      description: 超过128个 code points。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PasswordTooLongProblem'
          examples:
            sample:
              $ref: '#/components/examples/PasswordTooLong'
    VerificationCodeInvalidFormat:
      description: 不是6位 ASCII 数字字符串；不扣次数。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeInvalidFormatProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeInvalidFormat'
    TermsNotAccepted:
      description: 必须为 true，验证码值判断前拒绝。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TermsNotAcceptedProblem'
          examples:
            sample:
              $ref: '#/components/examples/TermsNotAccepted'
    EmailAlreadyRegistered:
      description: 邮箱已占用；不消费挑战，发码操作不投递。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EmailAlreadyRegisteredProblem'
          examples:
            sample:
              $ref: '#/components/examples/EmailAlreadyRegistered'
    EmailNotRegistered:
      description: 找回邮箱不存在，不投递。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EmailNotRegisteredProblem'
          examples:
            sample:
              $ref: '#/components/examples/EmailNotRegistered'
    CredentialsRejected:
      description: 邮箱不存在与密码不符同一结果，不透露账户存在性。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CredentialsRejectedProblem'
          examples:
            sample:
              $ref: '#/components/examples/CredentialsRejected'
    RegistrationClosed:
      description: 不创建账户、不发注册码、不消费挑战；登录找回仍可用。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RegistrationClosedProblem'
          examples:
            sample:
              $ref: '#/components/examples/RegistrationClosed'
    VerificationCodeMissing:
      description: challengeId 空字符串或查无挑战，要求重新发码。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeMissingProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeMissing'
    VerificationCodeBindingMismatch:
      description: 用途或规范邮箱不匹配，不扣次数。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeBindingMismatchProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeBindingMismatch'
    VerificationCodeConsumed:
      description: 挑战已成功消费，要求重新发码或用已提交密码登录恢复。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeConsumedProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeConsumed'
    VerificationCodeReplaced:
      description: 成功重发已经替换此挑战。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeReplacedProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeReplaced'
    VerificationCodeExpired:
      description: 服务端 now>=expiresAt，要求重发。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeExpiredProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeExpired'
    VerificationCodeIncorrect:
      description: 形状合法且绑定/生命周期有效，值错，返回剩余次数。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeIncorrectProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeIncorrect'
    VerificationCodeExhausted:
      description: 第五次值错及其后，剩余次数0，必须重发。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VerificationCodeExhaustedProblem'
          examples:
            sample:
              $ref: '#/components/examples/VerificationCodeExhausted'
    CodeSendCooldown:
      description: 同用途+规范邮箱发码冷却中，没有投递或挑战变化。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CodeSendCooldownProblem'
          examples:
            sample:
              $ref: '#/components/examples/CodeSendCooldown'
    CodeDeliveryUnavailable:
      description: 新挑战未激活；旧挑战保留。可能已有邮件被外部提供者接受，不声称到达或绝无投递。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CodeDeliveryUnavailableProblem'
          examples:
            sample:
              $ref: '#/components/examples/CodeDeliveryUnavailable'
    AccountStoreUnavailable:
      description: 账户不可读/损坏，或账户业务写入已回滚；不回种子账户。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AccountStoreUnavailableProblem'
          examples:
            sample:
              $ref: '#/components/examples/AccountStoreUnavailable'
    SessionPersistenceUnavailable:
      description: 记住我激活尚未提交，pending 身份保留，可重试或继续当前页。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SessionPersistenceUnavailableProblem'
          examples:
            sample:
              $ref: '#/components/examples/SessionPersistenceUnavailable'
    SessionStoreUnavailable:
      description: 会话读取失败或会话命令已回滚，可重试。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SessionStoreUnavailableProblem'
          examples:
            sample:
              $ref: '#/components/examples/SessionStoreUnavailable'
    BrowserContextRequired:
      description: 页面头缺失/形状错误，或需要的 bootstrap Cookie 未建立；先恢复浏览器上下文。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BrowserContextRequiredProblem'
          examples:
            sample:
              $ref: '#/components/examples/BrowserContextRequired'
    SessionInvalid:
      description: 会话/Cookie 无效、撤销、到期或绑定不匹配；不授权业务。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SessionInvalidProblem'
          examples:
            sample:
              $ref: '#/components/examples/SessionInvalid'
    SessionStateConflict:
      description: 会话已激活为另一模式或请求 remembered 超出原 rememberMe；GET 核实，不重做账户业务。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SessionStateConflictProblem'
          examples:
            sample:
              $ref: '#/components/examples/SessionStateConflict'
    ServiceUnavailable:
      description: 操作尚未提交或已回滚的服务故障；若无法确认提交结果，断开响应，不伪造此拒绝。
      headers:
        Cache-Control:
          $ref: '#/components/headers/AuthCacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableProblem'
          examples:
            sample:
              $ref: '#/components/examples/ServiceUnavailable'
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
      description: 服务端生成的不可预测标识；不是账户凭据，不能脱离 Cookie 授权。
    PageContext:
      type: string
      minLength: 32
      maxLength: 32
      pattern: ^[0-9a-f]{32}$
      description: 当前内存中的随机页面上下文；刷新/重开/放弃上下文时重新生成，不持久保存。
    CanonicalEmail:
      type: string
      minLength: 3
      maxLength: 254
      pattern: ^(?=.{1,254}$)(?=.{1,64}@)[a-z0-9_%+\-]+(?:\.[a-z0-9_%+\-]+)*@[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?)+$(?![\s\S])
      description: 规范 ASCII 邮箱；恰好一个 @，本地 1-64、无首尾/连续点；域至少两标签，每段 1-63，无首尾连字符。不做 DNS 查询。
    EmailInput:
      type: string
      description: 类型校验后执行 ECMAScript trim，再 ASCII 小写，结果必须通过 CanonicalEmail；此 schema 的原始字符串不以 format:email
        代替规范化后的验证。
      x-normalize:
      - ECMAScript-trim
      - ASCII-lowercase
      x-normalized-schema:
        $ref: '#/components/schemas/CanonicalEmail'
    CanonicalNickname:
      type: string
      minLength: 1
      maxLength: 40
      description: ECMAScript trim 后的账户昵称，按 Unicode code points 计数；不从邮箱派生。
    NicknameInput:
      type: string
      description: 类型检查后 ECMAScript trim，结果必须满足 CanonicalNickname；键入时不改写显示。
      x-normalize:
      - ECMAScript-trim
      x-normalized-schema:
        $ref: '#/components/schemas/CanonicalNickname'
    PasswordInput:
      type: string
      minLength: 8
      maxLength: 128
      description: Unicode code points 计数，保留首尾空白、大小写和 Unicode 原形，不 trim/normalize。
    VerificationCodeInput:
      type: string
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]{6}$
      examples:
      - '001234'
    TermsAcceptanceInput:
      type: boolean
      const: true
    Account:
      type: object
      properties:
        accountKey:
          type: string
          minLength: 1
          maxLength: 200
          description: 服务端分配且永久稳定的账户分区键；登录/重置/重启不变，永不重新分配。不是凭据。
        email:
          $ref: '#/components/schemas/CanonicalEmail'
        nickname:
          $ref: '#/components/schemas/CanonicalNickname'
      required:
      - accountKey
      - email
      - nickname
      additionalProperties: true
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        account:
          $ref: '#/components/schemas/Account'
        state:
          enum:
          - pending
          - active
        persistence:
          enum:
          - page
          - remembered
        rememberRequested:
          type: boolean
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - account
      - state
      - persistence
      - rememberRequested
      - issuedAt
      - expiresAt
      additionalProperties: true
      description: pending 尚未授权。pending 的 persistence=page；rememberRequested=true 时 expiresAt=issuedAt+7天。active
        page 的 expiresAt=null；active remembered 的 expiresAt=issuedAt+7天。
      allOf:
      - if:
          properties:
            state:
              const: pending
        then:
          properties:
            persistence:
              const: page
      - if:
          properties:
            state:
              const: active
            persistence:
              const: page
        then:
          properties:
            expiresAt:
              type: 'null'
      - if:
          properties:
            persistence:
              const: remembered
        then:
          properties:
            state:
              const: active
            rememberRequested:
              const: true
            expiresAt:
              type: string
              format: date-time
      - if:
          properties:
            state:
              const: pending
            rememberRequested:
              const: true
        then:
          properties:
            expiresAt:
              type: string
              format: date-time
      - if:
          properties:
            state:
              const: pending
            rememberRequested:
              const: false
        then:
          properties:
            expiresAt:
              type: 'null'
    PendingSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          state:
            const: pending
    ActiveSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          state:
            const: active
    RememberedSession:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - expiresAt
      additionalProperties: true
      description: 只有同一 Cookie 容器的可恢复目标元数据，不是客户端身份依据。
    SessionStatus:
      type: object
      properties:
        browserReady:
          type: boolean
        registrationOpen:
          type: boolean
        session:
          oneOf:
          - $ref: '#/components/schemas/Session'
          - type: 'null'
        rememberedSession:
          oneOf:
          - $ref: '#/components/schemas/RememberedSession'
          - type: 'null'
        serverTime:
          type: string
          format: date-time
      required:
      - browserReady
      - registrationOpen
      - session
      - rememberedSession
      - serverTime
      additionalProperties: true
      description: GET 是快照，不创建/绑定身份。无 Cookie 正常返回 browserReady=false，两个 session 为 null。损坏/失效 Cookie 返回 401；存储不可读返回
        503。
    Challenge:
      type: object
      properties:
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
        purpose:
          enum:
          - registration
          - password-reset
        email:
          $ref: '#/components/schemas/CanonicalEmail'
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        resendAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        remainingAttempts:
          type: integer
          const: 5
      required:
      - challengeId
      - purpose
      - email
      - issuedAt
      - expiresAt
      - resendAt
      - serverTime
      - remainingAttempts
      additionalProperties: true
      description: 已被邮件提供者接受且新挑战已持久激活；不保证到达收件箱，不含验证码。expiresAt=issuedAt+600秒，resendAt=issuedAt+30秒。
    RegistrationChallenge:
      allOf:
      - $ref: '#/components/schemas/Challenge'
      - properties:
          purpose:
            const: registration
    PasswordResetChallenge:
      allOf:
      - $ref: '#/components/schemas/Challenge'
      - properties:
          purpose:
            const: password-reset
    LoginRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/PasswordInput'
        rememberMe:
          type: boolean
      required:
      - email
      - password
      - rememberMe
      additionalProperties: false
    EmailCodeRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
      required:
      - email
      additionalProperties: false
    RegistrationRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
        nickname:
          $ref: '#/components/schemas/NicknameInput'
        password:
          $ref: '#/components/schemas/PasswordInput'
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
        verificationCode:
          $ref: '#/components/schemas/VerificationCodeInput'
        termsAccepted:
          $ref: '#/components/schemas/TermsAcceptanceInput'
        rememberMe:
          type: boolean
      required:
      - email
      - nickname
      - password
      - challengeId
      - verificationCode
      - termsAccepted
      - rememberMe
      additionalProperties: false
    PasswordResetRequest:
      type: object
      properties:
        verificationCode:
          $ref: '#/components/schemas/VerificationCodeInput'
        password:
          $ref: '#/components/schemas/PasswordInput'
        challengeId:
          $ref: '#/components/schemas/OpaqueId'
        email:
          $ref: '#/components/schemas/EmailInput'
      required:
      - verificationCode
      - password
      - challengeId
      - email
      additionalProperties: false
    BootstrapRequest:
      type: object
      properties:
        action:
          const: bootstrap
      required:
      - action
      additionalProperties: false
    ActivateRequest:
      type: object
      properties:
        action:
          const: activate
        sessionId:
          $ref: '#/components/schemas/OpaqueId'
        rememberMe:
          type: boolean
      required:
      - action
      - sessionId
      - rememberMe
      additionalProperties: false
      description: true 仅用于原登录/注册 rememberMe=true 的 pending；false 可继续当前页。相同选择重试安全，不重复账户业务。
    RestoreRequest:
      type: object
      properties:
        action:
          const: restore
        sessionId:
          $ref: '#/components/schemas/OpaqueId'
      required:
      - action
      - sessionId
      additionalProperties: false
    SessionCommand:
      oneOf:
      - $ref: '#/components/schemas/BootstrapRequest'
      - $ref: '#/components/schemas/ActivateRequest'
      - $ref: '#/components/schemas/RestoreRequest'
    LogoutRequest:
      type: object
      properties:
        sessionId:
          oneOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
      required:
      - sessionId
      additionalProperties: false
      description: 定向撤销页面绑定或同容器恢复目标；null 不选择其他会话，无目标也返回204。
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - sessionId
      - email
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 加密随机源生成的32字节随机串，发出前在本设备持久保存；所有核实复用原值。
        sessionId:
          $ref: '#/components/schemas/OpaqueId'
        email:
          $ref: '#/components/schemas/EmailInput'
    ProblemDetailsBase:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        field:
          type: string
      required:
      - type
      additionalProperties: true
      description: 单一主要问题；允许附加响应字段。type 决定语义，status 若存在须匹配 HTTP。title/detail 不决定 UI 文案。
    RequestNotAllowedProblem:
      description: 来源/保护头拒绝，无业务副作用。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/request-not-allowed
          status:
            const: 403
          field: false
        required: []
    MalformedJsonProblem:
      description: JSON 解析失败，包括空 body。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/malformed-json
          status:
            const: 400
          field: false
        required: []
    UnsupportedMediaTypeProblem:
      description: POST 只接受 application/json，可带 UTF-8 charset。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/unsupported-media-type
          status:
            const: 415
          field: false
        required: []
    InvalidRequestBodyProblem:
      description: JSON 根不是对象。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/invalid-request-body
          status:
            const: 422
          field: false
        required: []
    UnknownFieldProblem:
      description: 含当前操作未声明的 JSON 属性。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/unknown-field
          status:
            const: 422
          field: false
        required: []
    RequiredFieldProblem:
      description: 缺少必填属性，按 required 顺序定位。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/required-field
          status:
            const: 422
          field:
            type: string
        required:
        - field
    InvalidFieldTypeProblem:
      description: JSON 类型不符；不进行隐式转换。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/invalid-field-type
          status:
            const: 422
          field:
            type: string
        required:
        - field
    InvalidFieldValueProblem:
      description: 命令 action/标识形状不符；已命名业务字段错误优先使用专有 type。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/invalid-field-value
          status:
            const: 422
          field:
            type: string
        required:
        - field
    EmailEmptyProblem:
      description: 规范化后邮箱为空。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/email-empty
          status:
            const: 422
          field:
            const: email
        required:
        - field
    EmailInvalidFormatProblem:
      description: 规范邮箱形状或254总长度/各段边界不符。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/email-invalid-format
          status:
            const: 422
          field:
            const: email
        required:
        - field
    NicknameEmptyProblem:
      description: trim 后昵称为空。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/nickname-empty
          status:
            const: 422
          field:
            const: nickname
        required:
        - field
    NicknameTooLongProblem:
      description: trim 后超过40个 code points。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/nickname-too-long
          status:
            const: 422
          field:
            const: nickname
        required:
        - field
    PasswordTooShortProblem:
      description: 少于8个 code points。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/password-too-short
          status:
            const: 422
          field:
            const: password
        required:
        - field
    PasswordTooLongProblem:
      description: 超过128个 code points。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/password-too-long
          status:
            const: 422
          field:
            const: password
        required:
        - field
    VerificationCodeInvalidFormatProblem:
      description: 不是6位 ASCII 数字字符串；不扣次数。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-invalid-format
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    TermsNotAcceptedProblem:
      description: 必须为 true，验证码值判断前拒绝。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/terms-not-accepted
          status:
            const: 422
          field:
            const: termsAccepted
        required:
        - field
    EmailAlreadyRegisteredProblem:
      description: 邮箱已占用；不消费挑战，发码操作不投递。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/email-already-registered
          status:
            const: 409
          field:
            const: email
        required:
        - field
    EmailNotRegisteredProblem:
      description: 找回邮箱不存在，不投递。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/email-not-registered
          status:
            const: 422
          field:
            const: email
        required:
        - field
    CredentialsRejectedProblem:
      description: 邮箱不存在与密码不符同一结果，不透露账户存在性。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/credentials-rejected
          status:
            const: 401
          field: false
        required: []
    RegistrationClosedProblem:
      description: 不创建账户、不发注册码、不消费挑战；登录找回仍可用。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/registration-closed
          status:
            const: 403
          field: false
        required: []
    VerificationCodeMissingProblem:
      description: challengeId 空字符串或查无挑战，要求重新发码。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-missing
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    VerificationCodeBindingMismatchProblem:
      description: 用途或规范邮箱不匹配，不扣次数。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-binding-mismatch
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    VerificationCodeConsumedProblem:
      description: 挑战已成功消费，要求重新发码或用已提交密码登录恢复。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-consumed
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    VerificationCodeReplacedProblem:
      description: 成功重发已经替换此挑战。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-replaced
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    VerificationCodeExpiredProblem:
      description: 服务端 now>=expiresAt，要求重发。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-expired
          status:
            const: 422
          field:
            const: verificationCode
        required:
        - field
    VerificationCodeIncorrectProblem:
      description: 形状合法且绑定/生命周期有效，值错，返回剩余次数。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-incorrect
          status:
            const: 422
          field:
            const: verificationCode
          remainingAttempts:
            type: integer
            minimum: 1
            maximum: 4
        required:
        - field
        - remainingAttempts
    VerificationCodeExhaustedProblem:
      description: 第五次值错及其后，剩余次数0，必须重发。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/verification-code-exhausted
          status:
            const: 422
          field:
            const: verificationCode
          remainingAttempts:
            type: integer
            const: 0
        required:
        - field
        - remainingAttempts
    CodeSendCooldownProblem:
      description: 同用途+规范邮箱发码冷却中，没有投递或挑战变化。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/code-send-cooldown
          status:
            const: 429
          field: false
          retryAfterSeconds:
            type: integer
            minimum: 1
            maximum: 30
          resendAt:
            type: string
            format: date-time
        required:
        - retryAfterSeconds
        - resendAt
    CodeDeliveryUnavailableProblem:
      description: 新挑战未激活；旧挑战保留。可能已有邮件被外部提供者接受，不声称到达或绝无投递。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/code-delivery-unavailable
          status:
            const: 503
          field: false
        required: []
    AccountStoreUnavailableProblem:
      description: 账户不可读/损坏，或账户业务写入已回滚；不回种子账户。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/account-store-unavailable
          status:
            const: 503
          field: false
        required: []
    SessionPersistenceUnavailableProblem:
      description: 记住我激活尚未提交，pending 身份保留，可重试或继续当前页。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/session-persistence-unavailable
          status:
            const: 503
          field: false
        required: []
    SessionStoreUnavailableProblem:
      description: 会话读取失败或会话命令已回滚，可重试。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/session-store-unavailable
          status:
            const: 503
          field: false
        required: []
    BrowserContextRequiredProblem:
      description: 页面头缺失/形状错误，或需要的 bootstrap Cookie 未建立；先恢复浏览器上下文。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/browser-context-required
          status:
            const: 409
          field: false
        required: []
    SessionInvalidProblem:
      description: 会话/Cookie 无效、撤销、到期或绑定不匹配；不授权业务。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/session-invalid
          status:
            const: 401
          field: false
        required: []
    SessionStateConflictProblem:
      description: 会话已激活为另一模式或请求 remembered 超出原 rememberMe；GET 核实，不重做账户业务。
      allOf:
      - $ref: '#/components/schemas/ProblemDetailsBase'
      - properties:
          type:
            const: /problems/auth/session-state-conflict
          status:
            const: 409
          field: false
