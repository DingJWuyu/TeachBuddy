  /api/auth/account-deletion:
    post:
      operationId: deleteAccount
      summary: 删除当前账户并核实原请求结果
      description: |-
        首次请求必须来自当前页面的有效 active 会话，确认邮箱经规范化后必须与该账户相同，否则为 422 deletion-confirmation-mismatch；未授权为 401 session-invalid。requestId 由浏览器用加密随机源生成，发出前已在本设备持久保存，所有核实复用原值。

        - 受理事务先记录删除意图，并撤销该账户全部会话、页面绑定和记住我指针；此后旧身份、在途写入、登录和密码重置都不能重新授予该账户权限，其他账户照常使用。随后等待该账户的作业与进程结束，清理受管文件和业务资料，再原子删除认证账户、全部挑战和旧认证镜像。
        - 只有全部清理完成才返回 204。清理失败为 503 deletion-incomplete，不是已回滚，账户锁和受管文件清单保留。同账户已有受理中的删除时，新请求为 409 deletion-in-progress。
        - 完成回执只保留 requestId 的 SHA-256、原 Cookie、sessionId、规范邮箱与 requestId 的 HMAC 证明、原 Cookie 的容器摘要和完成时间，不再保存账户标识、邮箱或文件清单。
        - 原请求可在同一 Cookie 下重复核实，刷新后的新页面头仍须合法。核实只能完成原删除，不建立身份；其他 Cookie、改动过的 body 或新 requestId 都不能代用。204 不清除容器 Cookie，以便回执丢失后继续核实，也不影响同容器的其他账户。
        - 客户端只有收到原请求的 204 才清理本设备资料并进入匿名页；未知、401 或匿名状态都不算删除成功。核实优先重发原请求；因页面绑定失效被拒时，只在 GET 返回的 remembered 目标与原 sessionId 完全一致时 restore 该目标，再在同一页面上下文提交一次原 body，不循环、不借用另一会话。若 GET 证实原浏览器上下文已失效（例如维护恢复清除了回执和容器），页面说明原结果无法核实，清除本页核实意图后重新准备登录，保留该账户的设备资料。
        - 服务器启动时，在工作台初始化之后对每条已受理未完成的删除各接续一次，复用原清理步骤，不创建新意图、不授予身份；单条失败保留锁和清单，不阻止其他账户启动。原浏览器证明丢失不取消已受理的删除。
        - 同一邮箱重新注册会得到新的 accountKey，不继承旧数据。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: 账户和受管资料已清理，或原请求已确认完成；无body，不清容器Cookie。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/session-invalid
        '409':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/browser-context-required
                      - /problems/auth/deletion-in-progress
        '422':
          description: 请求未获接受；type确定语义，字段错误附field。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/invalid-request-body
                      - /problems/auth/unknown-field
                      - /problems/auth/required-field
                      - /problems/auth/invalid-field-type
                      - /problems/auth/invalid-field-value
                      - /problems/auth/email-empty
                      - /problems/auth/email-invalid-format
                      - /problems/auth/deletion-confirmation-mismatch
        '503':
          description: 删除未完成或存储不可用；不承诺回滚，保持原请求核实。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProblemDetailsBase'
                - properties:
                    type:
                      enum:
                      - /problems/auth/deletion-incomplete
                      - /problems/auth/account-store-unavailable
                      - /problems/auth/service-unavailable
