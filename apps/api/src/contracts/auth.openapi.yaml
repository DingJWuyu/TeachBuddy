          description: 撤销指定当前会话完成；业务时点以 auth.md 为准。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
            Set-Cookie:
              $ref: '#/components/headers/SessionSetCookie'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '400':
