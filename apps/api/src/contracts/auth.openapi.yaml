openapi: 3.2.1
info:
  title: TeachBuddy 账户入口契约
  version: 1.2.0-candidate.1
  description: |-
    账户入口与身份契约：登录、注册、两类验证码、密码重置、会话状态与激活恢复、退出、账户删除和昵称修改。字段、状态码与样本以本文件的 schema 为准；工作台受保护请求复用这里的 Cookie、页面头与来源保护。

    ## 协议

    - 页面与 /api 同源 HTTPS，不开放跨源 CORS。POST 使用 JSON 和 `X-TeachBuddy-Request: 1`；先验证完整 Origin，仅 Origin 缺失时回退 Referer。来源错误、null、不可解析、两者都缺失或保护头不符统一返回 403 request-not-allowed，不进入业务。GET 不改变账户或会话状态，也不执行激活或恢复。
    - 所有成功与失败响应 `Cache-Control: no-store`。有数据直接返回对象；无数据且动作确实完成才返回 204。错误为 application/problem+json，只有一个主要 type，只有字段错误带 field；可选 status 必须等于 HTTP 状态。客户端按 type 和当前操作映射文案，不解析 title/detail；响应可带附加字段，已声明字段和必填结构仍须校验。
    - 503 只表示操作尚未提交或已回滚。服务端无法确认提交结果时断开响应，不伪造这类拒绝。

    ## 输入与首错顺序

    - 请求封闭、类型严格，不做隐式转换。邮箱和昵称在类型检查后执行 ECMAScript `String.prototype.trim`，邮箱再做 ASCII 小写，结果分别由 CanonicalEmail、CanonicalNickname 约束；密码和验证码不做任何规范化。长度一律按 Unicode code point 计数。确认密码、密码显隐和条款链接不传输。
    - 协议首错顺序：来源与保护头、媒体类型、JSON 解析、根值为对象、未知字段、必填缺失、字段类型；必填按 schema 的 required 顺序，其他按 properties 顺序。协议错误不消耗验证码。随后检查页面头形状，错误属于 browser-context-required，不是字段错误。
    - 之后按操作的业务顺序裁决（"浏览器上下文"指所需的 bootstrap Cookie 已建立）：
      - login：邮箱、密码边界、浏览器上下文、账户可读、统一凭据拒绝、创建 pending 会话。
      - requestRegistrationCode：邮箱、注册开放、账户可读、邮箱未占用、冷却、发码。
      - register：邮箱、注册开放、昵称、密码、challengeId 形状、验证码形状、条款为 true、浏览器上下文、账户可读、挑战绑定/生命周期/值、邮箱仍未占用、原子提交。
      - requestPasswordResetCode：邮箱、账户可读、账户存在、冷却、发码。
      - resetPassword：验证码形状、密码边界、challengeId 形状、邮箱、账户可读、挑战绑定/生命周期/值、原子提交。
      - changeSession 与 logout：命令形状、Cookie 和页面绑定、目标会话与账户可读、最新撤销与到期检查、相应动作。
    - changeSession 的根对象通过后，先拒绝不属于任何命令的属性，再判 action 缺失、类型或枚举；选定命令后按该分支拒绝多余属性、必填缺失和类型错误。未知 action 为 invalid-field-value（field=action），不猜测命令分支。
    - 注册关闭、邮箱冲突等业务拒绝不消费挑战、不扣次数。注册开放状态以事务裁决时为准；客户端在进入注册表单、重新获得焦点和提交前读取 registrationOpen，已知关闭时不发注册请求。

    ## 验证码

    - challengeId 由服务端产生，绑定规范邮箱和用途（registration、password-reset），不是登录凭据；每个用途加邮箱同时只有一个活动挑战。challengeId 为空字符串按 verification-code-missing 定位到验证码；其他形状错误为 invalid-field-value（field=challengeId）。
    - 发码 200 表示邮件提供者已接受投递且挑战已持久激活，不表示已到达收件箱；API 不返回验证码。有效期从 issuedAt 起 600 秒，resendAt 为 issuedAt + 30 秒，错误预算 5。服务端时间为最终裁决，等于 expiresAt 即过期；客户端用 serverTime 校准倒计时。
    - 同一用途加邮箱的发码串行裁决。冷却期间返回 429 code-send-cooldown 和向上取整的 Retry-After，不发送、不换码。重发成功才替换旧挑战：旧 challengeId 返回 verification-code-replaced，新 challengeId 配旧值算一次真实错码。投递被拒、超时或挑战写入失败返回 503 code-delivery-unavailable，旧挑战与冷却不变。数据库与邮件不在同一事务，失败只承诺挑战未替换，不承诺没有邮件抵达。
    - 验证顺序：挑战存在、用途与邮箱匹配；再判已消费、已替换、过期、已耗尽；最后比较值。绑定错误和形状错误不扣次数。前四次错值返回 422 verification-code-incorrect，remainingAttempts 依次为 4、3、2、1；第五次返回 verification-code-exhausted、remainingAttempts=0，此后正确值也拒绝。扣减持久保存，并发错码原子计数，写失败不声称已扣减。

    ## 原子结果与未知结果

    - register 的账户创建、挑战消费和 pending 会话创建在同一 SQLite 提交中完成。resetPassword 的密码写入、该账户全部旧会话（含页面绑定与记住我指针）撤销和挑战消费在同一提交中完成；并发登录或激活不能越过重置重新授予旧凭据的身份。存储失败整体回滚并返回 503 account-store-unavailable，正确验证码仍可重试。resetPassword 不修改浏览器 Cookie，避免重置一个账户误清同一浏览器里另一个账户的载体。
    - register 与 resetPassword 不使用 Idempotency-Key。重复的成功提交得到 verification-code-consumed，不会再次创建账户或改密。超时、断网或响应结构不明不能证明没有提交：客户端保留输入、引导用提交的凭据登录核实，不自动重复。只有明确的已回滚 Problem 或可证明请求尚未发出才算未执行；register 收到 session-store-unavailable 也不能断言已回滚。login 结果不明按普通失败处理；发码结果不明时不安装猜测的挑战，冷却后重发。

    ## 会话与页面上下文

    - `__Host-teachbuddy_session` 是只由服务端签发的不可预测 opaque Cookie，标识当前浏览器的认证容器。容器内每个页面可以绑定各自的会话，另有至多一个记住我恢复目标。只有核验通过的 active 会话授权业务，空容器不是身份。不使用 Bearer、localStorage 令牌或关闭 Secure 的替代方案。
    - `X-TeachBuddy-Page` 在每次文档加载和放弃认证上下文时随机生成，只保存在内存；刷新、重开和 BFCache 恢复都不沿用页面级身份。它只是容器内的选择器：单独此头、sessionId 或 accountKey 都不能授权，不存在的页面绑定也不回退到记住我身份。
    - 无 Cookie 的 GET 返回匿名状态且不设置 Cookie。bootstrap 建立空容器（已有有效容器则保持），Set-Cookie 初始不带到期属性；客户端再 GET 确认 browserReady 后才允许 login 与 register。两类发码和 resetPassword 不依赖容器。
    - login 与 register 成功只返回 pending 会话，不修改 Cookie、不授权。客户端只对仍属于当前提交的结果调用 activate，rememberMe 沿用原提交的选择，注册固定为 true；激活再次验证账户和会话。page 模式的 expiresAt 为 null；remembered 模式的 expiresAt 为 issuedAt + 7 天的绝对期限，激活重试和恢复都不延期，Cookie Max-Age 为剩余整秒。新一次激活替换容器的恢复指针，page 激活清空恢复指针，都不撤销其他页面已绑定的会话。
    - 保存记住我失败返回 503 session-persistence-unavailable，pending 保留。继续当前会话为 activate + rememberMe=false，重试保存为 activate + true，都不重做登录、注册或验证码。同 sessionId、同选择的重复激活返回当前结果；已激活后换选择返回 409 session-state-conflict。激活结果未知时先 GET 核实，不能把已成功的保存报成失败。
    - restore 把仍有效的 remembered 目标绑定到当前页面，不接受浏览器自报的账户。无 Cookie、目标失效、被替换、已撤销或到期返回 401 session-invalid；账户数据损坏返回 503 可重试，绝不回到种子账户。
    - GET 是实时检查，不是缓存。客户端在页面可见时每 30 秒、重新获得焦点、收到跨页通知和业务 401 时复核；通知只触发复核，不是身份依据。服务端对每个业务请求实时核验，客户端的复核间隔不是授权宽限。
    - 迟到的 pending 不激活。放弃已知 pending 或恢复目标时用 logout 定向撤销，再更换页面上下文；GET、activate、restore 的结果都要核对当前代次和目标 id，迟到成功不得回填。取消网络请求不等于撤销；被放弃的 activate、restore 与 logout 按目标会话原子串行，已撤销的目标不能复活。
    - Cookie 被浏览器禁用时没有可用会话，停在可恢复的错误上。一次往返只证明 Cookie 当前可用，不证明浏览器重开后一定保留。

    ## 退出

    - logout 撤销当前容器中与请求页面绑定的指定会话，也可以撤销 GET 返回的同容器 remembered 目标；该会话的全部页面绑定和匹配的恢复指针一并失效。pending 同样可撤销。它不撤销其他设备、独立登录或其他账户，不是"退出全部设备"；密码重置和账户删除才撤销整个账户。
    - 只清除目标：旧退出请求不能撤销同页之后新建的不同 sessionId。服务端先持久撤销再返回 204，响应不透露其他容器的 sessionId 是否存在。
    - 客户端收到 204 才宣布退出完成并回到登录。已知失败保留重试；响应丢失时为"退出结果暂未确认"，停止业务交互，重试同一 sessionId，直到 204 或经 GET 证实目标失效。未决目标按 sessionId 持久保留（不保存 Cookie、页面头或密码），刷新后的新页只对匹配的未决目标阻止恢复，不锁住另一可信账户。当前页保持原页面头完成定向撤销，确认后再旋转页面上下文、bootstrap 并 GET 确认，本次准备不自动采用另一 remembered 身份。
servers:
- url: /
  description: 页面与 API 同源 HTTPS；本地浏览器联调保持相同安全属性。
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 核验凭据并创建待激活会话
      description: 必须先 bootstrap 并确认 Cookie 可用。成功不设置 Cookie、不自动激活；随后调用 changeSession 的 activate。已有 Cookie 不替代本次密码校验。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: 核验凭据并创建待激活会话完成。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSession'
              examples:
                sample:
                  $ref: '#/components/examples/Pending'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - oneOf:
                  - $ref: '#/components/schemas/InvalidRequestBodyProblem'
                  - $ref: '#/components/schemas/UnknownFieldProblem'
                  - $ref: '#/components/schemas/RequiredFieldProblem'
                  - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                  - $ref: '#/components/schemas/InvalidFieldValueProblem'
                  - $ref: '#/components/schemas/EmailEmptyProblem'
                  - $ref: '#/components/schemas/EmailInvalidFormatProblem'
                  - $ref: '#/components/schemas/PasswordTooShortProblem'
                  - $ref: '#/components/schemas/PasswordTooLongProblem'
                - properties:
                    field:
                      enum:
                      - email
                      - password
                      - rememberMe
        '401':
          $ref: '#/components/responses/CredentialsRejected'
        '503':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountStoreUnavailableProblem'
                - $ref: '#/components/schemas/SessionStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
        '409':
          $ref: '#/components/responses/BrowserContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              sample:
                $ref: '#/components/examples/Login'
  /api/auth/registration-codes:
    post:
      operationId: requestRegistrationCode
      summary: 申请或重发注册验证码
      description: 无需登录/Cookie，按用途+邮箱限制。只有完整成功结果可安装挑战。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security: []
      responses:
        '200':
          description: 申请或重发注册验证码完成。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationChallenge'
              examples:
                sample:
                  $ref: '#/components/examples/RegistrationCode'
        '403':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/RequestNotAllowedProblem'
                - $ref: '#/components/schemas/RegistrationClosedProblem'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - oneOf:
                  - $ref: '#/components/schemas/InvalidRequestBodyProblem'
                  - $ref: '#/components/schemas/UnknownFieldProblem'
                  - $ref: '#/components/schemas/RequiredFieldProblem'
                  - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                  - $ref: '#/components/schemas/InvalidFieldValueProblem'
                  - $ref: '#/components/schemas/EmailEmptyProblem'
                  - $ref: '#/components/schemas/EmailInvalidFormatProblem'
                - properties:
                    field:
                      enum:
                      - email
        '409':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmailAlreadyRegisteredProblem'
                - $ref: '#/components/schemas/BrowserContextRequiredProblem'
        '429':
          $ref: '#/components/responses/CodeSendCooldown'
        '503':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CodeDeliveryUnavailableProblem'
                - $ref: '#/components/schemas/AccountStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
            examples:
              sample:
                $ref: '#/components/examples/SendCode'
  /api/auth/register:
    post:
      operationId: register
      summary: 创建账户与待激活会话
      description: 账户创建/挑战消费/pending会话原子提交。后续记住我失败不否定创建结果；响应不明不可自动重复注册。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      responses:
        '201':
          description: 创建账户与待激活会话完成。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSession'
              examples:
                sample:
                  $ref: '#/components/examples/Pending'
        '403':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/RequestNotAllowedProblem'
                - $ref: '#/components/schemas/RegistrationClosedProblem'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - oneOf:
                  - $ref: '#/components/schemas/InvalidRequestBodyProblem'
                  - $ref: '#/components/schemas/UnknownFieldProblem'
                  - $ref: '#/components/schemas/RequiredFieldProblem'
                  - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                  - $ref: '#/components/schemas/InvalidFieldValueProblem'
                  - $ref: '#/components/schemas/EmailEmptyProblem'
                  - $ref: '#/components/schemas/EmailInvalidFormatProblem'
                  - $ref: '#/components/schemas/PasswordTooShortProblem'
                  - $ref: '#/components/schemas/PasswordTooLongProblem'
                  - $ref: '#/components/schemas/VerificationCodeInvalidFormatProblem'
                  - $ref: '#/components/schemas/VerificationCodeMissingProblem'
                  - $ref: '#/components/schemas/VerificationCodeBindingMismatchProblem'
                  - $ref: '#/components/schemas/VerificationCodeConsumedProblem'
                  - $ref: '#/components/schemas/VerificationCodeReplacedProblem'
                  - $ref: '#/components/schemas/VerificationCodeExpiredProblem'
                  - $ref: '#/components/schemas/VerificationCodeIncorrectProblem'
                  - $ref: '#/components/schemas/VerificationCodeExhaustedProblem'
                  - $ref: '#/components/schemas/NicknameEmptyProblem'
                  - $ref: '#/components/schemas/NicknameTooLongProblem'
                  - $ref: '#/components/schemas/TermsNotAcceptedProblem'
                - properties:
                    field:
                      enum:
                      - email
                      - nickname
                      - password
                      - challengeId
                      - verificationCode
                      - termsAccepted
                      - rememberMe
        '409':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmailAlreadyRegisteredProblem'
                - $ref: '#/components/schemas/BrowserContextRequiredProblem'
        '503':
          description: 本操作的拒绝；首错顺序见 info 的“输入与首错顺序”。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
              examples:
                atomicStoreFailure:
                  $ref: '#/components/examples/AccountStoreUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            examples:
              sample:
                $ref: '#/components/examples/Register'
  /api/auth/password-reset-codes:
    post:
      operationId: requestPasswordResetCode
      summary: 申请或重发密码找回验证码
      description: 无需登录/Cookie；只有账户存在且发码成功才进入确认卡。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
