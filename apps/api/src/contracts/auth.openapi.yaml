openapi: 3.2.1
info:
  title: TeachBuddy 账户入口契约
  version: 1.2.0-candidate.1
  description: I01-I07 沿用 AUTH-CONTRACT-CORRECTION@1 冻结契约；I08 为账户删除、I09 为昵称修改扩展候选。docs/contracts/auth.md 拥有跨操作语义与首错顺序，docs/acceptance/auth-cases.md 拥有双向用例。请求封闭、类型严格；响应允许附加字段，已声明字段仍校验。所有响应
    no-store。
x-contract-status: candidate
x-accepted-source:
  scope: I01-I07
  commit: c7420af8c2740ddee5e01caa6da8bf7f57c134e2
  prototype-tree: 6f4a7d30c16a67b44af1e7a9c1157abb6d065b6b
  integrated-commit: 5b12a9063cc0b692103df73997cb8963506bd9ea
  integrated-prototype-tree: 1281d51665a740573a0a6f237b9e37d0335cf2c3
servers:
- url: /
  description: 页面与 API 同源 HTTPS；本地浏览器联调保持相同安全属性。
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 核验凭据并创建待激活会话
      x-interaction-id: I01
      x-contract-status: frozen
      description: 必须先 bootstrap 并确认 Cookie 可用。成功不设置 Cookie、不自动激活；随后 I06 activate。已有 Cookie 不替代本次密码校验。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: 核验凭据并创建待激活会话完成；业务时点以 auth.md 为准。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSession'
              examples:
                sample:
                  $ref: '#/components/examples/Pending'
        '403':
          $ref: '#/components/responses/RequestNotAllowed'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: 本操作的拒绝；首错及无副作用保证见 auth.md。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                allOf:
                - oneOf:
                  - $ref: '#/components/schemas/InvalidRequestBodyProblem'
                  - $ref: '#/components/schemas/UnknownFieldProblem'
                  - $ref: '#/components/schemas/RequiredFieldProblem'
                  - $ref: '#/components/schemas/InvalidFieldTypeProblem'
                  - $ref: '#/components/schemas/InvalidFieldValueProblem'
                  - $ref: '#/components/schemas/EmailEmptyProblem'
                  - $ref: '#/components/schemas/EmailInvalidFormatProblem'
                  - $ref: '#/components/schemas/PasswordTooShortProblem'
                  - $ref: '#/components/schemas/PasswordTooLongProblem'
                - properties:
                    field:
                      enum:
                      - email
                      - password
                      - rememberMe
        '401':
          $ref: '#/components/responses/CredentialsRejected'
        '503':
          description: 本操作的拒绝；首错及无副作用保证见 auth.md。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountStoreUnavailableProblem'
                - $ref: '#/components/schemas/SessionStoreUnavailableProblem'
                - $ref: '#/components/schemas/ServiceUnavailableProblem'
        '409':
          $ref: '#/components/responses/BrowserContextRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              sample:
                $ref: '#/components/examples/Login'
