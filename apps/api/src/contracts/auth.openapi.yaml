      operationId: getSession
      summary: 读取页面会话与可恢复目标
      x-interaction-id: I06
      x-contract-status: frozen
      description: 无 Cookie 为200匿名；GET 不创建/激活/恢复身份，不续期。
      parameters:
      - $ref: '#/components/parameters/PageContext'
      security:
      - {}
      - SessionCookie: []
      responses:
        '200':
          description: 读取页面会话与可恢复目标完成；业务时点以 auth.md 为准。
          headers:
            Cache-Control:
              $ref: '#/components/headers/AuthCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
              examples:
                sample:
                  $ref: '#/components/examples/AnonymousStatus'
