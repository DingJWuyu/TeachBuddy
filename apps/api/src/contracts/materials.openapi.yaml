  /api/modules/resources/items:
    get:
      operationId: listResources
      summary: listResources
      description: "非空 q 同时匹配名称、原文件名、备注和当前文件的可提取正文，并返回 search。先应用账户、活动/归档、文件夹（含后代）、标签和格式条件，再匹配关键词，排序不变。search.matches 只含本次返回且正文命中的资源，值含第一处命中的 page 和纯文本 excerpt（纯文本的 page 为 null）。原生正文另带 native:{fileId,textFileId,renditionFileId}，分别固定正文所属的原件或补充文件、实际提取文字的不可变文件和已有预览（尚无预览时为 null）；Office 的 textFileId 是派生 PDF，原 PDF 和纯文本是自身。OCR 命中使用识别结果的来源身份，原生同页命中优先。正文来源：原 PDF 和 UTF-8 纯文本直接提取，Office 用已有预览 PDF，有补充 PDF 时以它为准；每次按资源当前文件解析，替换与历史恢复不需要改旧缓存。派生文字按账户与不可变文件 ID 缓存，可以重建。每次查询最多提取一份未缓存文件：pending 是尚待读取或预览仍在运行的资料数，调用方继续同一查询直到为零；unavailable 表示没有可提取正文或没有可用的 PDF 预览；failed 表示读取失败。它们都不阻断其他匹配。PDF 文字提取的输出至多 8 MiB、500 页、进程至多 12 秒，超限记为读取失败。图像和无文字的扫描件不在这里 OCR。GET 计算缓存不改变资源版本、文件或预览任务。打开命中时客户端须重新读取条目、原件和预览并核对来源仍相同，失配时提示重新查询。sha256 按当前原件摘要查重，同样遵循活动/归档条件与账户隔离，不自动合并条目。"
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 200
      - name: state
        in: query
        required: false
        schema:
          enum:
          - active
          - deleted
          default: active
      - name: folderId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: tagIds
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 0
          maxItems: 100
          uniqueItems: true
        style: form
        explode: true
      - name: mediaType
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 150
      - name: sha256
        in: query
        schema:
          type: string
          pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: 当前账户的持久结果。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store
          content:
            application/json:
              schema:
