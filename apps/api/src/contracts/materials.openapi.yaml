  /api/modules/questions/v2/items/{id}/assets:
    post:
      operationId: createQuestionAsset
      summary: createQuestionAsset
      description: "受理 question-asset Job 并冻结题目版本。question-png 生成透明背景的题面分片，includeAnswers=true 时答案另成分片，从不含长期笔记；figure-png 必须给出属于该快照的 figureFileId，其他模式该字段为 null。PNG 宽 1600 px，文字与行内公式按段混排，保留选项、表格和配图顺序；分片优先按块边界，长块按真实行边界拆，单片高度不超过 2400 px，超高的单幅图等比缩小，公式保持完整。outputFileIds 按显示顺序排列，全部输出保存成功后才发布。失败分类：unsupported-formula 只表示实际公式校验或排版失败，field 指向已确定的题干或答案；配图问题为 missing-asset 或 asset-image-failed，浏览器运行为 asset-render-failed，文件存储为 asset-storage-failed，明确的 ENOSPC 才是 disk-full；未知异常不推测为公式问题。提示和诊断不含原始路径、异常正文或题目内容。该 Job 不能 retry，重新生成用新键再调用本操作。文字和公式复制直接从 Document 读取，不经服务端。"
