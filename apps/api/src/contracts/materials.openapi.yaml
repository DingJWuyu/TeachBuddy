openapi: 3.2.1
info:
  title: TeachBuddy materials
  version: 1.0.0-candidate.1
  description: |
    材料、题库与资源的 HTTP 契约。字段以本文件的 schema 为准；身份、Cookie、保护头、来源校验、no-store、UUID、服务端 UTC、乐观版本、账户作用域幂等、软删除与未知结果的共同协议见 workbench.openapi.yaml。

    ## 共同规则

    - 所有操作（包括文件字节、缩略图、裁图、预览、任务、补充原稿和引用读取）先解析可信身份：无身份 401，不存在或属于其他账户的对象统一 404。客户端不传账户标识，也不能让服务器去拉取任意 URL。
    - JSON 写体上限 2 MiB；文件上传例外，一次一个 multipart file，最多 100 MiB。单份收录材料最多 100 张图片或一个 PDF/Word，总页数最多 500（不是一次模型请求）。超限返回 413 或 422，已保存的原件仍可下载。
    - 未知字段和错误类型不做转换，按 workbench 的首错次序返回。schema 通过后依次校验归属、版本、对象状态、分类、位置、内容、引用；引用按数组顺序校验。解析合法但违反跨字段关系时返回规定的 problem，不返回 500。
    - 已成功的原键重放先于对象最新版本和状态的校验；身份、来源和 schema 仍最先校验。
    - 资源和收录材料的标题须含非空白字符，否则 422 invalid-input；标题按输入保存，不自动改写。
    - 列表返回全部匹配结果，按 updatedAt 降序、ID 升序；File 没有列表接口。GET 不隐式修改对象，也不启动有副作用的处理。
    - 响应可以带附加字段；必填值缺失或未知状态不能当成功。

    ## 幂等与未知结果

    - 所有写请求带 Idempotency-Key。成功记录跨重启保留，失败不消耗键。202 只表示任务与初始业务记录已在同一事务中保存，不表示任务完成。
    - 客户端超时、5xx 或无效响应时，先用同键同请求确认；已知 4xx 修正后换新键。
    - 识别模型请求的结果未知与浏览器写入的结果未知不同：已发出但没有可验证输出的模型请求标 provider-result-unknown，后台不自动再次请求，只有老师明确重试才重新受理。

    ## 题库版本过渡

    - `/api/modules/questions/v2` 与 workbench.openapi.yaml 中的旧题库路径读写相同的对象、ID、业务版本和幂等账本。路径属于幂等指纹，结果未知的旧请求必须在原路径确认，不能换到 v2 重试。
    - v2 读取旧对象时 Document.version=1 原样返回，补空分类，并由旧 solution 是否为空推出 answerStatus。纯读取不写回、不增加版本。v2 写入只有用到新节点的文档才写成 v2，不全量重写旧文档；来源快照不随后续内容迁移被替换，旧副本来源中的 v1 快照保持 v1。
    - 旧操作在可表示的对象上继续满足原 schema，旧请求没有提供的附加元数据（如分类）保持不变。旧客户端读取、列出或覆盖含 v2 文档或新来源的对象时返回 422 invalid-input / unsupported-content-version，不做有损投影，也不在列表里静默漏掉。旧写入先重放已成功的原请求，再检查版本，最后拒绝不可表示的覆盖。

    ## 文件与预览

    - 文件是服务端托管的不可变字节，fileId 保存后稳定；资源条目的 version 与 fileId 无关。同账户相同字节可共用物理存储，但每次新上传保留独立的元数据和原文件名，并返回 duplicateOfFileId 供界面提示，不自动合并资源或题目；跨账户不暴露重复命中。
    - 上传在字节写盘、校验、持久元数据和成功记录都成立后才完成，浏览器发送完毕不算。字节先写入 staging、校验长度与摘要并 fsync，原子 rename 到最终路径并同步目录，最后提交 SQLite 元数据和幂等响应。DB 提交前崩溃最多留下无关联的字节，不会出现可读的悬空文件记录；DB 提交失败不返回 FileSaved。采用同账户去重时也校验已有字节实际存在且摘要一致。
    - 已登记的文件缺失或损坏返回 503 storage-unavailable 并保留对象元数据。磁盘与 DB 不假装是同一个事务：派生任务先写完全部字节，再一次提交成果记录，失败的文件不进入 outputFileIds。
    - 文件名只用于显示和安全下载名，格式按内容检测。宏、外部关系和内嵌脚本不执行。每次转换使用独立临时目录和 LibreOffice profile，参数经 argv 传递，转换器没有网络、宏、外部链接和宿主目录访问。默认上限：原件 100 MiB、500 页、解压展开 512 MiB、单页 4000 万像素、单次转换 120 秒；超限保留原件并返回明确错误。
    - PNG/JPEG/WebP/PDF 直接产生预览；DOCX/DOC/PPTX/PPT 经固定转换得到 PDF 与页图；HTML 只作转义文本预览，其他文件只能下载。Preview.state：ready 表示完整生成并通过页数和输出检查；limited 表示已有真实内容但风险或缺页未解决；failed 表示不可预览。DOC 永远带 legacy-object-loss 风险，进程正常退出不能消除它。
    - 下载每次重新授权，不暴露磁盘路径、存储地址或永久公开链接。
    - 没有文件永久删除接口：原件、页图、裁图、输出，以及软删除对象和幂等响应引用的文件都保留。

    ## 原稿定位

    - page：fileId 是原件，renditionFileId 是生成时固定的 PDF 或图片（PDF 原件可与之相同）。page 从 1 起，图片 page=1。box 以页面最终显示方向的左上角为原点归一化，须 x+width≤1、y+height≤1；空 box 只表示整页定位，不能用于裁图。多张图片各带自己的 fileId，显示序号由输入顺序决定。
    - text：start/end 按原文字的 Unicode code point 计数，左闭右开，0≤start<end≤长度；不能用 UTF-16 code unit，以免中文补充字符错位。
    - docx：在原 DOCX 或任务已保存的 DOC 转换稿的 `word/document.xml` 中，按深度优先给段落从 1 编号（正文和表格内的段落都计入），runStart/runEnd 是该段文字、公式、图片 run 序列的左闭右开索引。fileId 仍是原件；DOC 的转换来源和原件/派生件摘要必须由服务端任务保存，不能由客户端自证。结构位置不等于 Office 页码，有可靠固定 rendition 时同时保存 page 定位。
    - LocatedPart 区分题面、答案、配图和未分配片段；跨页的一题有多个位置，分散的答案另有位置。每个 file 和 rendition 必须来自该收录原件或已保存补充原件的派生链。

    ## 内容

    - Document 是 v1 与 v2 的封闭联合。v2 增加图片、标题、选项/小问列表、表格和教师注记，没有任意 HTML 或 attrs。列表项有显示 label 和有序块；表格各行列数相同，不支持合并单元格。
    - 文字与 LaTeX 是规范源，OMML 只是导出制品。LaTeX 按数学语法白名单处理，不运行 TeX 的文件、网络或宏指令。存储允许无法排版的原始源，编辑器显示失败；导出时不能形成可编辑 OMML 则返回带 field 的 unsupported-formula，不用截图代替。
    - 除 schema 的逐层上限外，总块数≤2000、总数学源≤200000 字符，不允许无限递归。正文至少有一项可见文字、公式或图片。正文图片只能引用已可读取的 PNG/JPEG/WebP。
    - answerStatus=absent 时 solution 必须为空，present 时非空；unresolved 只存在于收录草稿，不能入库。题面和答案不夹带 teacher-note；手写长期笔记在 note，归入的资料摘录在 noteFragments。
    - 未知 Document.version 在读取端保留原数据并只读，在写入端明确拒绝，绝不删掉不认识的节点。

    ## 资料摘录（noteFragments）

    - Draft、Question 和 UpdateQuestion 的 noteFragments 每条保存原 Fragment 的 id、当前 importId、可编辑 document 与固定 locations。同一片段在同一收录中最多归入一个草稿的笔记，原片段须标为 assigned；来源必须匹配已保存的片段，已归入题干或答案的片段不能再归入笔记。草稿移除摘录后片段恢复待处理。
    - 入库时采用稿存入题目，与原材料独立；彻底删除原材料后题目和摘录仍可读。
    - 更新题目或保存校对时省略 noteFragments 保留旧值，显式空数组才清空；更新题目只能编辑既有摘录或移除条目，不能新增或改变出处。CreateQuestion、CopyQuestion 不接受该字段。改编快照和题面素材都不含两类笔记。

    ## 分类

    - QuestionTaxonomy 与 ResourceTaxonomy 各是所属模块内的一个版本化集合，不共享。term 和 folder 的 ID 是稳定 UUID；名称由服务端去首尾空白后须非空，同类名称按 Unicode NFC + casefold 唯一（文件夹只在同一父级内唯一）。同名、循环或未知 ID 返回 422 materials/invalid-taxonomy，集合与关联不变。
    - 全量 PUT 中省略的项表示删除。改名保留 ID；删除在同一事务中移除全部活动和已归档对象的关联，并增加受影响对象的版本，不改动引用快照。正在用旧 baseVersion 编辑的题目或资源会冲突，不能覆盖分类删除的效果。
    - 自动整理只能建议集合中已有的 ID，不能增改集合。题型单选、标签多选；查询的 tagIds 为全部匹配，空查询等于不过滤。

    ## 任务（Job）

    - 只有页预览、提取、页识别和题面素材这几类长操作保存 Job。单进程顺序执行重操作；界面在运行时约每 2 秒轮询 GET，离开页面停止。progress.completed/total 按实际页或阶段统计，total 未知时为 null。Job.target 不携带账户，账户由服务端持有。
    - 状态：queued → running → succeeded / partial / failed。停止请求立即持久为 cancelling，到安全检查点后为 cancelled。进程重启时遗留的 running 变为 interrupted，cancelling 变为 cancelled，queued 继续执行，不重发结果未知的模型请求。partial 表示已有成功内容并有明确的未完成单元；succeeded 只表示机器处理完成，收题仍需老师校对；输入损坏或全部失败为 failed。已落盘的结果逐单元检查后继续，不靠内存状态认定成功。
    - 单元 ID：文件提取 `file:<UUID>:page:<N>`，文字提取 `text:<start>:<end>`，预览整体 `file:<UUID>`，页识别 `page:<N>`。
    - 停止状态由 jobs 裁决，迟到的执行结果不能把 cancelled 改成 succeeded。同键重放受理请求始终返回最初的任务，之后用 GET 看当前状态。

    ## 识别

    - 题库和资源库消费同一份机器页结果，模块只负责采用、校对和自己的业务结构，不各自启动 OCR。
    - 原件、rendition 和页图都是同账户受管文件，且必须出现在已生成的固定预览映射中。成功页按账户、页图字节摘要和引擎/转换修订复用；同像素的另一份上传可以复用结果，但返回的 location 始终绑定本次请求的原件、rendition 和绝对页号。
    - 重试的 unitId 为 `page:N`，空集合代表原请求全部未完成页，已成功页不变。引擎修订变化后拒绝重试旧 Job，需要重新发起识别。
    - ready 表示完整结果、文稿和引用的文件都可读取，不表示老师已校对，也不表示识别准确。结果包含 resultId、输入摘要、引擎修订和本次来源 location；rawFileId 指向原始识别 JSON（官方版面、结构结果、模型响应与图片来源映射），不被 Document 转换覆盖；document 是 Document v2，text 是可搜索的全文投影；blocks 保留官方块的数组顺序，空 order 不触发重新排序；assetFileIds 含全部派生与原始图片，originalAssetFileIds 单列原始图片，不能用图片总数计算文稿里的图数；derivations 保存每张图的原坐标、polygon、派生矩形和裁图疑点；issues 汇集格式恢复、未解析数学、结构缺口和裁图疑点。
    - 机械转换只表达模型实际返回的内容：不添加答案、不重画原图、不纠正数学结论、不按题号规则修补。普通正文中的大写几何点名加整数下标可恢复为数学 run，上下文明确的字面换行可恢复为同一单元格内的段落，二者都保留 math-recovered / text-lines-recovered 提示，原始 JSON 不变；其他没有定界符的 LaTeX 保持原文并标疑点。
    - 被引用的图片缺失或内容不可读取时整页失败，不能伪装成空页成功。旧结果中的 ocr-text-conflict、ocr-source-gap 和 content_check 仍可读取，新识别不再生成。
    - 取消或超时期间已经完整返回的原始结果和图片作为该 Job 的证据保存，不发布为 ready，也不重开任务；后续重试不擦除这份绑定。无法确认本地识别进程已停止时，页和 Job 标记失败并提示清理未确认，不报告取消完成。

    ## 收录与校对

    - 收录只产生 Draft，老师用 commitImportDrafts 确认后才建立 Question。机器输出要校验 schema、输入覆盖、题边界、公式、实际配图绑定、原有答案角色和原稿定位，不照抄模型的 needs_review=false。截断响应只采纳前缀中完整、可独立验证的对象并记录 truncated-response，整批为部分失败。识别不生成解答，已有答案和未提供答案严格区分。
    - 题号比较使用 NFKC、去空白、去末尾分隔符与 `Q` 前缀，原文和字符范围不变。独立的"答案："与"参考答案"标题都进入答案区；答案必须与题目唯一匹配，重复题号保留答案片段并标待核对，不按出现顺序猜。无题号的非空正文保留为待校对候选，只有答案或教师活动的内容不建空题。
    - 未分配 Fragment 可带 document（机器稿为 v2），保留表格、数学与图片；text 是最多 20000 字符的阅读摘要，完整内容以 document 为准，旧的纯文字片段继续按 text 读取。老师明确归入题干或答案时追加原块和该片段的真实来源；未提供答案的草稿归入答案后为 present，原有的待核对状态仍须解决。
    - 重试后的新机器结果只补充候选，已有人工校对或已入库的对象保持。重复的机器片段按输入单元与原稿定位关联，不靠题号覆盖。
    - 校对定位可以修正，修正只改关联定位，不能改来源 importId、draftId 或原始字节；复制来源固定，原题软删除后其原稿仍可经原题链读取。
x-contract-status: READY_FOR_REVIEW
servers:
- url: /
security:
- SessionCookie: []
paths:
  /api/workbench/files/{id}/recognition:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: getFileRecognition
      description: "只读固定预览的识别状态：配置是否可用、固定来源和每页状态。GET 不受理识别、不触发模型。省略 renditionFileId 时读当前预览，消费者应传画面中固定的 rendition。"
      parameters:
      - name: renditionFileId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 当前账户原件、固定 rendition 和每页状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionSummary'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: requestFileRecognition
      description: "冻结原件、rendition 和页号后持久受理 recognition Job，只返回受理结果。尚无预览返回 preview-required；引擎不可用且需要新识别时返回 recognition-unavailable。活跃请求已覆盖全部所选页时返回同一 Job；仍有其他页在处理时返回 job-running，不静默改变选择。取消与重试沿用 Job 接口。"
      parameters:
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognitionInput'
      responses:
        '202':
          description: 已受理的识别 Job，尚未表示识别成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/workbench/files/{id}/recognition/pages/{page}:
    get:
      operationId: getRecognizedPage
      description: "返回这一份来源的机器页结果。复用的结果也绑定本次原件、rendition 和绝对页号，模型给出的空页号或相对序号不覆盖这个映射。省略 renditionFileId 只读当前预览。未配置引擎时既有成功结果仍可读取。"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: page
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: renditionFileId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 未完成时保留状态，ready 时提供正文、结构和附件；不是人工校对完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognizedPage'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/workbench/files:
    post:
      operationId: uploadFile
      summary: uploadFile
      description: multipart/form-data，恰好一个 file；每文件最多 100 MiB。幂等指纹使用文件名、检测 MIME、字节 SHA-256，忽略 multipart boundary。
      parameters:
      - $ref: '#/components/parameters/BrowserRequestProtection'
      - $ref: '#/components/parameters/RequestOrigin'
      - $ref: '#/components/parameters/RequestReferer'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 当前账户的持久结果。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
