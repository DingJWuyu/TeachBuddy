components:
  schemas:
    RecognitionInput:
      type: object
      properties:
        renditionFileId:
          $ref: '#/components/schemas/Id'
        pages:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      required: [renditionFileId, pages]
      additionalProperties: false
    RecognitionSummary:
      type: object
      properties:
        available:
          type: boolean
        revision:
          type: string
        fileId:
          $ref: '#/components/schemas/Id'
        renditionFileId:
          $ref: '#/components/schemas/Id'
        jobId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        pages:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
              state:
                enum: [unprocessed, queued, running, cancelling, ready, failed, interrupted]
              resultId:
                anyOf:
                - $ref: '#/components/schemas/Id'
                - type: 'null'
              issues:
                type: array
                items:
                  type: object
            required: [page, state, resultId, issues]
      required: [available, revision, fileId, renditionFileId, jobId, pages]
    RecognizedPage:
      type: object
      properties:
        state:
          enum: [unprocessed, running, ready, failed, interrupted]
        resultId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        location:
          $ref: '#/components/schemas/Location'
        imageFileId:
          $ref: '#/components/schemas/Id'
        width:
          type: integer
        height:
          type: integer
        document:
          $ref: '#/components/schemas/Document'
        text:
          type: string
        blocks:
          type: array
          items:
            type: object
        rawFileId:
          $ref: '#/components/schemas/Id'
        assetFileIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        issues:
          type: array
          items:
            type: object
