openapi: 3.2.1
info:
  title: TeachBuddy schedule
  version: 1.0.0-candidate.1
  description: >-
    日程的 v1 兼容契约，只为旧请求保留；当前字段与语义见 schedule-v2.openapi.json。
    旧客户端带已退役 course 字段的请求，只能按原账户、原幂等键和原请求体重放已经成功的回执，回执不再含教学关联；
    没有成功回执的新写入拒绝该字段，不创建关联或额外任务。
servers:
  - url: /
security:
  - SessionCookie: []
paths:
  /api/modules/schedule/settings:
    get:
      operationId: getScheduleSettings
      description: getScheduleSettings
      parameters: []
      responses:
        "200":
          description: 当前账户结果。
          headers: &a1
            Cache-Control:
              required: true
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
    put:
      operationId: updateScheduleSettings
      description: updateScheduleSettings
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
  /api/modules/schedule/entries:
    get:
      operationId: listEntries
      description: 返回完整模板，不展开重复。updatedAt 降序、id 升序。未排期用 placement=unscheduled。
      parameters:
        - $ref: "#/components/parameters/State"
        - name: placement
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - unscheduled
            default: all
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
    post:
      operationId: createEntry
      description: createEntry
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "201":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
  /api/modules/schedule/entries/{id}:
    get:
      operationId: getEntry
      description: getEntry
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
    put:
      operationId: updateEntry
      description: updateEntry
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
  /api/modules/schedule/entries/{id}/deletion:
    post:
      operationId: setEntryDeletion
      description: setEntryDeletion
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Deletion"
  /api/modules/schedule/entries/{id}/exceptions:
    get:
      operationId: listExceptions
      description: listExceptions
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionList"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
  /api/modules/schedule/entries/{id}/exceptions/{originDate}:
    put:
      operationId: setException
      description: override/取消/恢复继承；成功返回该实例以及递增后的 entryVersion。
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/originDate"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionInput"
  /api/modules/schedule/entries/{id}/occurrence:
    get:
      operationId: getOccurrence
      description: 重复必须
        originDate；非重复必须省略。未排期或不符合原始周节律404；取消/删除返回可辨认内容。符合节律但超过until（有无例外均同）返回outside-series供旧通知定位。
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
  /api/modules/schedule/occurrences:
    get:
      operationId: listOccurrences
      description: listOccurrences
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Date"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Date"
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceList"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
  /api/modules/schedule/item-moves:
    post:
      operationId: moveItem
      description: moveItem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveItem"
  /api/modules/schedule/notifications:
    get:
      operationId: listNotifications
      description: T53：结算到期后返回未 dismissed 的全部记录和未读计数；不展示生成时间。
      parameters: []
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
  /api/modules/schedule/notifications/{id}:
    post:
      operationId: changeNotification
      description: T53：单条 read/dismiss；重复已读保留第一次 readAt。dismiss 不删除唯一痕迹。
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeAction"
  /api/modules/schedule/notification-actions:
    post:
      operationId: changeNotifications
      description: T53：全部已读/清空传当前展示的明确 ID 集合，新到通知不被吞。任一外账户/不存在 ID 404 且整体不写。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BrowserRequestProtection"
        - $ref: "#/components/parameters/RequestOrigin"
        - $ref: "#/components/parameters/RequestReferer"
      responses:
        "200":
          description: 持久成功结果；写入重放保持原状态码和结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeBatchResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeBatch"
  /api/modules:
    get:
      operationId: getTeachingModuleCatalog
      description: 已装配的四个模块按当前目录投影。
      parameters: []
      responses:
        "200":
          description: 当前账户结果。
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleCatalogV2"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
components:
  securitySchemes:
    SessionCookie:
      $ref: auth.openapi.yaml#/components/securitySchemes/SessionCookie
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    originDate:
      name: originDate
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Date"
    kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum:
          - question
    State:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - active
          - deleted
        default: active
    Origin:
      name: originDate
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Date"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BrowserRequestProtection:
      $ref: auth.openapi.yaml#/components/parameters/BrowserRequestProtection
    RequestOrigin:
      $ref: auth.openapi.yaml#/components/parameters/RequestOrigin
    RequestReferer:
      $ref: auth.openapi.yaml#/components/parameters/RequestReferer
  responses:
    "400":
      description: malformed-json
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/malformed-json
    "401":
      description: unauthenticated
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/unauthenticated
    "403":
      description: request-not-allowed
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/request-not-allowed
    "404":
      description: not-found
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/not-found
    "409":
      description: version-conflict / idempotency-key-reused / object-deleted /
        reference-deleted / class-mismatch / immutable-series / invalid-move
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/version-conflict
                      - /problems/workbench/idempotency-key-reused
                      - /problems/workbench/object-deleted
                      - /problems/workbench/reference-deleted
                      - /problems/workbench/class-mismatch
                      - /problems/workbench/immutable-series
                      - /problems/workbench/invalid-move
    "413":
      description: payload-too-large
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/payload-too-large
    "415":
      description: unsupported-media-type
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/unsupported-media-type
    "422":
      description: invalid-input / invalid-time-zone / reminder-not-future
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/invalid-input
                      - /problems/workbench/invalid-time-zone
                      - /problems/workbench/reminder-not-future
    "503":
      description: temporarily-unavailable
      headers: *a1
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - properties:
                  type:
                    enum:
                      - /problems/workbench/temporarily-unavailable
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
    Date:
      type: string
      format: date
      pattern: ^(19\d{2}|20\d{2}|2100)-\d{2}-\d{2}$
      description: 有效公历日期 1900-01-01 至 2100-12-31，语义仍校验月日。
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
    Zone:
      type: string
      minLength: 1
      maxLength: 100
      description: 有效 IANA 时区；初始 Asia/Shanghai。
    Time:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/Date"
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        timeZone:
          $ref: "#/components/schemas/Zone"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
      required:
        - date
        - startTime
        - timeZone
        - durationMinutes
      additionalProperties: false
    Reminder:
      type: object
      properties:
        side:
          type: string
          enum:
            - before
            - after
        minutes:
          type: integer
          minimum: 0
          maximum: 10080
      required:
        - side
        - minutes
      additionalProperties: false
    Repeat:
      type: object
      properties:
        until:
          $ref: "#/components/schemas/Date"
      required:
        - until
      additionalProperties: false
    Item:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          type: string
          maxLength: 4000
          minLength: 1
        priority:
          type: string
          enum:
            - low
            - normal
            - high
      required:
        - id
        - text
        - priority
      additionalProperties: false
    Deletion:
      type: object
      properties:
        expectedVersion:
          $ref: "#/components/schemas/Version"
        deleted:
          type: boolean
      required:
        - expectedVersion
        - deleted
      additionalProperties: false
    EntryInput:
      type: object
      properties:
        title: &a2
          type: string
          maxLength: 300
        items: &a3
          type: array
          items:
            $ref: "#/components/schemas/Item"
          maxItems: 200
        time: &a4
          anyOf:
            - $ref: "#/components/schemas/Time"
            - type: "null"
        repeat: &a5
          anyOf:
            - $ref: "#/components/schemas/Repeat"
            - type: "null"
        reminder: &a6
          anyOf:
            - $ref: "#/components/schemas/Reminder"
            - type: "null"
      required:
        - title
        - items
        - time
        - repeat
        - reminder
      additionalProperties: false
      description: 标题非空或至少一个非空事项；事项 ID 在本 Entry 唯一。未排期 time=null 时
        repeat/reminder=null。repeat 非空必须有 time。
    EntryUpdate:
      type: object
      properties:
        expectedVersion:
          $ref: "#/components/schemas/Version"
        title: *a2
        items: *a3
        time: *a4
        repeat: *a5
        reminder: *a6
      required:
        - expectedVersion
        - title
        - items
        - time
        - repeat
        - reminder
      additionalProperties: false
