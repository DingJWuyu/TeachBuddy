            - type: "null"
        toIndex:
          type: integer
          minimum: 0
      required:
        - itemId
        - fromEntryId
        - fromVersion
        - toEntryId
        - toVersion
        - toIndex
      additionalProperties: false
      description: 不同的两个非重复 Entry；toEntryId=null 时 toVersion=null、toIndex=0，否则
        toVersion 必填非空且 toIndex<=目标长度。
    MoveResult:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/Entry"
        to:
          $ref: "#/components/schemas/Entry"
      required:
        - from
        - to
    Notification:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        key:
          $ref: "#/components/schemas/OccurrenceKeyView"
        title:
          type: string
          maxLength: 300
          description: 由 projectReminderTitle(entry) 投影；标题去首尾空白后为空时取首项事项，再按 Unicode code
            point 取前300个字符且不追加省略号。
        dueAt:
          $ref: "#/components/schemas/Timestamp"
        readAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        dismissedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
        - id
        - key
        - title
        - dueAt
        - readAt
        - dismissedAt
    NotificationList:
      type: object
