        mode:
          const: inherit
      required:
        - expectedVersion
        - mode
      additionalProperties: false
    ExceptionInput:
      oneOf:
        - $ref: "#/components/schemas/SetOverride"
        - $ref: "#/components/schemas/SetCancelled"
        - $ref: "#/components/schemas/ResetException"
    Exception:
      type: object
      properties:
        originDate:
          $ref: "#/components/schemas/Date"
        mode:
          type: string
          enum:
            - override
            - cancelled
        eligible:
          type: boolean
        content:
          anyOf:
            - $ref: "#/components/schemas/OverrideView"
            - type: "null"
      required:
        - originDate
        - mode
        - eligible
        - content
    ExceptionList:
      type: object
      properties:
        entryId:
          $ref: "#/components/schemas/Id"
        version:
          $ref: "#/components/schemas/Version"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exception"
      required:
        - entryId
        - version
        - items
    Occurrence:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/OccurrenceKeyView"
        entryVersion:
          $ref: "#/components/schemas/Version"
        exception:
          type: boolean
        state:
          type: string
          enum:
            - active
            - cancelled
            - deleted
            - outside-series
        title:
          type: string
          maxLength: 300
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemView"
        time:
          $ref: "#/components/schemas/TimeView"
        startsAt:
          $ref: "#/components/schemas/Timestamp"
        endsAt:
          $ref: "#/components/schemas/Timestamp"
        timeAdjusted:
          type: boolean
        reminder:
          anyOf:
            - $ref: "#/components/schemas/ReminderView"
            - type: "null"
        dueAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
