        - entryVersion
        - exception
        - state
        - title
        - items
        - time
        - startsAt
        - endsAt
        - timeAdjusted
        - reminder
        - dueAt
      description: 活动实例与通知定位。取消/删除/范围外保留可识别内容，dueAt 只表示配置所得时刻，不表示仍会产生通知；timeAdjusted
        表示 DST 缺失时刻发生了调整。
    OccurrenceList:
      type: object
      properties:
        timeZone:
          $ref: "#/components/schemas/Zone"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
      required:
        - timeZone
        - items
    MoveItem:
      type: object
